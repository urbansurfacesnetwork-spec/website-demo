<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint - USRN</title>
    <style>
        @font-face {
            font-family: 'Fractul';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Fractul', Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: transparent;
        }

        #toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            background: transparent;
            padding: 8px 12px;
            border: none;
        }

        #toolbar label {
            font-size: 13px;
            font-family: 'Fractul', Arial, sans-serif;
        }

        #toolbar input[type="range"] {
            width: 90px;
            cursor: pointer;
        }

        #toolbar input[type="color"] {
            width: 36px;
            height: 28px;
            padding: 0;
            border: 1px solid #aaa;
            border-radius: 3px;
            cursor: pointer;
        }

        .tool-btn {
            padding: 5px 12px;
            font-family: 'Fractul', Arial, sans-serif;
            font-size: 13px;
            border: 1px solid #aaa;
            border-radius: 3px;
            background: #f0f0f0;
            cursor: pointer;
            transition: background 0.15s;
        }

        .tool-btn:hover {
            background: #ddd;
        }

        .tool-btn.active {
            background: #1f77b4;
            color: #fff;
            border-color: #1f77b4;
        }

        .tool-btn.active-buff {
            background: #6b4b3e;
            color: #fff;
            border-color: #6b4b3e;
        }

        .tool-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        #canvas-wrapper {
            position: relative;
            display: inline-block;
            border: none;
            border-radius: 0;
            background-image: url('canvas-background.png');
            background-size: 100% 100%;
            background-color: transparent;
            width: 1280px;
            height: 2072px;
        }

        #drawCanvas {
            display: block;
            cursor: crosshair;
            background: transparent;
            width: 1280px;
            height: 2072px;
            border-radius: 0;
            border: none;
        }
    </style>
</head>
<body>

<div id="toolbar">
    <button class="tool-btn active" id="btnBrush">Marker</button>
    <button class="tool-btn" id="btnEraser">Eraser</button>
    <button class="tool-btn" id="btnBuff">Buff</button>
    <button class="tool-btn" id="btnSticker">Sticker</button>
    <button class="tool-btn" id="btnPasteUp">Paste-Up</button>
    <button class="tool-btn" id="btnAdvertise">Advertise</button>

    <label>Size&nbsp;<input type="range" id="brushSize" min="1" max="60" value="8"></label>
    <span id="sizeDisplay" style="font-size:13px;min-width:24px;">8</span>

    <label id="colorPickerLabel">Color&nbsp;<input type="color" id="colorPicker" value="#000000"></label>

    <button class="tool-btn" id="btnUndo" disabled>Undo</button>
    <button class="tool-btn" id="btnRedo" disabled>Redo</button>

    <button class="tool-btn" id="btnClear">Clear</button>
</div>

<div id="canvas-wrapper">
    <canvas id="drawCanvas" width="1280" height="2072"></canvas>
</div>

<script>
(function () {
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');

    // Tools
    let tool = 'brush';
    let painting = false;
    let lastX = 0, lastY = 0;
    let brushSize = 8;
    let color = '#000000';

    // Sticker images
    const stickerImg = new Image();
    stickerImg.src = 'sticker.png';
    const pasteUpImg = new Image();
    pasteUpImg.src = 'pasteup.png';

    // Advert images (135×181 each)
    const ADVERT_W = 135, ADVERT_H = 181;
    const advertImgs = ['advert-02.png', 'advert-03.png', 'advert-04.png'].map(src => {
        const img = new Image(); img.src = src; return img;
    });
    let advertIndex = 0;

    // History for undo/redo
    const MAX_HISTORY = 40;
    let history = [];
    let historyIndex = -1;

    function saveSnapshot() {
        history = history.slice(0, historyIndex + 1);
        history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        if (history.length > MAX_HISTORY) {
            history.shift();
        }
        historyIndex = history.length - 1;
        updateHistoryButtons();
    }

    function updateHistoryButtons() {
        document.getElementById('btnUndo').disabled = historyIndex <= 0;
        document.getElementById('btnRedo').disabled = historyIndex >= history.length - 1;
    }

    saveSnapshot();

    // Brush size
    const sizeSlider = document.getElementById('brushSize');
    const sizeDisplay = document.getElementById('sizeDisplay');
    sizeSlider.addEventListener('input', function () {
        brushSize = parseInt(this.value, 10);
        sizeDisplay.textContent = brushSize;
    });

    // Color
    const colorPicker = document.getElementById('colorPicker');
    colorPicker.addEventListener('input', function () {
        color = this.value;
        if (tool === 'eraser') switchTool('brush');
    });

    // All tool button ids
    const toolBtns = ['btnBrush', 'btnEraser', 'btnBuff', 'btnSticker', 'btnPasteUp', 'btnAdvertise'];

    function switchTool(t) {
        tool = t;
        toolBtns.forEach(id => {
            const btn = document.getElementById(id);
            btn.classList.remove('active', 'active-buff');
        });
        const activeId = { brush: 'btnBrush', eraser: 'btnEraser', buff: 'btnBuff', sticker: 'btnSticker', pasteup: 'btnPasteUp', advertise: 'btnAdvertise' }[t];
        if (activeId) {
            document.getElementById(activeId).classList.add(t === 'buff' ? 'active-buff' : 'active');
        }

        // Show/hide color picker based on tool
        const colorLabel = document.getElementById('colorPickerLabel');
        colorLabel.style.display = (t === 'buff') ? 'none' : '';

        // Show/hide size slider based on tool
        const sizeLabel = sizeSlider.parentElement;
        const sizeDisp = document.getElementById('sizeDisplay');
        if (t === 'pasteup' || t === 'advertise') {
            sizeLabel.style.display = 'none';
            sizeDisp.style.display = 'none';
        } else {
            sizeLabel.style.display = '';
            sizeDisp.style.display = '';
        }

        if (t === 'buff') {
            color = '#6b4b3e';
            colorPicker.value = '#6b4b3e';
        }

        const cursorMap = { eraser: 'cell', sticker: 'copy', pasteup: 'copy', advertise: 'copy' };
        canvas.style.cursor = cursorMap[t] || 'crosshair';
    }

    document.getElementById('btnBrush').addEventListener('click', () => switchTool('brush'));
    document.getElementById('btnEraser').addEventListener('click', () => switchTool('eraser'));
    document.getElementById('btnBuff').addEventListener('click', () => switchTool('buff'));
    document.getElementById('btnSticker').addEventListener('click', () => switchTool('sticker'));
    document.getElementById('btnPasteUp').addEventListener('click', () => switchTool('pasteup'));
    document.getElementById('btnAdvertise').addEventListener('click', () => switchTool('advertise'));

    // Undo / Redo
    document.getElementById('btnUndo').addEventListener('click', function () {
        if (historyIndex > 0) {
            historyIndex--;
            ctx.putImageData(history[historyIndex], 0, 0);
            updateHistoryButtons();
        }
    });

    document.getElementById('btnRedo').addEventListener('click', function () {
        if (historyIndex < history.length - 1) {
            historyIndex++;
            ctx.putImageData(history[historyIndex], 0, 0);
            updateHistoryButtons();
        }
    });

    // Clear
    document.getElementById('btnClear').addEventListener('click', function () {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        saveSnapshot();
    });

    // Drawing
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const src = e.touches ? e.touches[0] : e;
        return {
            x: (src.clientX - rect.left) * scaleX,
            y: (src.clientY - rect.top) * scaleY
        };
    }

    function stampImage(img, x, y) {
        const size = brushSize * 6;
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
        ctx.restore();
    }

    function stampPasteUp(x, y) {
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(pasteUpImg, x - ADVERT_W / 2, y - ADVERT_H / 2, ADVERT_W, ADVERT_H);
        ctx.restore();
    }

    function stampAdvert(x, y) {
        const img = advertImgs[advertIndex % advertImgs.length];
        advertIndex++;
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(img, x - ADVERT_W / 2, y - ADVERT_H / 2, ADVERT_W, ADVERT_H);
        ctx.restore();
    }

    function drawBuff(x, y) {
        // Spray-paint style: scatter dots in a circle around the point
        const density = 80;
        const radius = brushSize * 1.5;
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = '#6b4b3e';
        for (let i = 0; i < density; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * radius;
            const px = x + r * Math.cos(angle);
            const py = y + r * Math.sin(angle);
            ctx.globalAlpha = Math.random() * 0.5 + 0.2;
            ctx.beginPath();
            ctx.arc(px, py, Math.random() * 2 + 0.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    function startDraw(e) {
        e.preventDefault();
        painting = true;
        const pos = getPos(e);
        lastX = pos.x;
        lastY = pos.y;
        draw(e);
    }

    function draw(e) {
        if (!painting) return;
        e.preventDefault();
        const pos = getPos(e);

        if (tool === 'sticker') {
            stampImage(stickerImg, pos.x, pos.y);
        } else if (tool === 'pasteup') {
            stampPasteUp(pos.x, pos.y);
        } else if (tool === 'advertise') {
            stampAdvert(pos.x, pos.y);
        } else if (tool === 'buff') {
            drawBuff(pos.x, pos.y);
        } else {
            ctx.save();
            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (tool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.strokeStyle = 'rgba(0,0,0,1)';
            } else {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = color;
            }

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.restore();
        }

        lastX = pos.x;
        lastY = pos.y;
    }

    function stopDraw(e) {
        if (!painting) return;
        painting = false;
        saveSnapshot();
    }

    // Mouse
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);

    // Touch
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDraw);

    // Keyboard shortcuts
    document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key === 'z') {
            document.getElementById('btnUndo').click();
        } else if ((e.ctrlKey || e.metaKey) && ((e.shiftKey && e.key === 'z') || e.key === 'y')) {
            document.getElementById('btnRedo').click();
        }
    });
}());
</script>

</body>
</html>
