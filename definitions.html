<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Surface Definitions</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: visible;
        }

        body {
            margin: 0;
            font-family: 'CustomFont', sans-serif;
            background: #191919;
            color: #e0e0e0;
        }

        #main {
            width: 100%;
            height: 100vh;
            background: #191919;
            overflow: visible;
        }

        .error {
            color: #ff6b6b;
            padding: 16px;
            font-family: Arial, sans-serif;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
</head>
<body>
<div id="main"></div>

<script>
    let chartInstance = null;
    let resizeHandler = null;
    let selectedPairId = null;
    let selectedPairIndices = [];

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function wrapText(text, maxCharsPerLine = 48) {
        if (!text) return '';
        const words = text.trim().split(/\s+/);
        const lines = [];
        let currentLine = '';

        words.forEach((word) => {
            const candidate = currentLine ? `${currentLine} ${word}` : word;
            if (candidate.length <= maxCharsPerLine) {
                currentLine = candidate;
            } else {
                if (currentLine) lines.push(currentLine);
                currentLine = word;
            }
        });

        if (currentLine) lines.push(currentLine);
        return lines.join('\n');
    }

    async function init() {
        if (resizeHandler) {
            window.removeEventListener('resize', resizeHandler);
            resizeHandler = null;
        }
        if (chartInstance && !chartInstance.isDisposed()) {
            chartInstance.dispose();
            chartInstance = null;
        }
        selectedPairId = null;
        selectedPairIndices = [];

        let chart = null;
        try {
            const response = await fetch('data.json');
            if (!response.ok) {
                throw new Error(`Failed to fetch data.json: ${response.statusText}`);
            }

            const data = await response.json();
            const lastName = (name) => name.trim().split(/\s+/).pop() || '';
            const peopleWithDefinitions = (data.nodes || [])
                .filter((node) => node && typeof node.name === 'string' && node.definition && String(node.definition).trim())
                .sort((a, b) => lastName(a.name).localeCompare(lastName(b.name)) || a.name.localeCompare(b.name));

            const treeData = {
                name: 'Definitions of urban surfaces (based on discipline and research)',
                symbolSize: 0,
                label: { show: true },
                children: peopleWithDefinitions.map((person, pairId) => ({
                    name: person.name,
                    pairId,
                    labelType: 'person',
                    children: [
                        {
                            name: wrapText(person.definition, 40),
                            fullDefinition: person.definition,
                            pairId,
                            labelType: 'definition'
                        }
                    ]
                }))
            };

            chart = echarts.init(document.getElementById('main'));
            chartInstance = chart;
            const option = {
                backgroundColor: '#191919',
                tooltip: {
                    show: false
                },
                series: [
                    {
                        type: 'tree',
                        data: [treeData],
                        top: '4%',
                        left: '2%',
                        bottom: '4%',
                        right: '40%',
                        orient: 'LR',
                        symbol: 'roundRect',
                        symbolSize: [10, 10],
                        itemStyle: {
                            color: '#808080',
                            borderColor: '#808080'
                        },
                        expandAndCollapse: false,
                        initialTreeDepth: -1,
                        lineStyle: {
                            color: '#4a4a4a',
                            width: 1,
                            opacity: 0.65
                        },
                        roam: 'move',
                        label: {
                            position: 'right',
                            verticalAlign: 'middle',
                            align: 'left',
                            fontSize: 8,
                            color: '#d7d7d7',
                            fontFamily: 'CustomFont, sans-serif'
                        },
                        leaves: {
                            label: {
                                position: 'right',
                                verticalAlign: 'middle',
                                align: 'left',
                                fontSize: 7,
                                lineHeight: 12,
                                color: '#bdbdbd',
                                fontFamily: 'CustomFont, sans-serif'
                            }
                        },
                        emphasis: {
                            focus: 'relative',
                            label: {
                                fontSize: 14,
                                lineHeight: 18
                            },
                            lineStyle: { opacity: 0.85 }
                        }
                    }
                ]
            };

            chart.setOption(option);
            chart.dispatchAction({
                type: 'treeRoam',
                seriesIndex: 0,
                dx: -40,
                dy: 0
            });
            document.getElementById('main').addEventListener('wheel', (event) => {
                event.preventDefault();
                event.stopImmediatePropagation();
                const bounds = event.currentTarget.getBoundingClientRect();
                chart.dispatchAction({
                    type: 'treeRoam',
                    seriesIndex: 0,
                    zoom: Math.exp(-event.deltaY * 0.0004),
                    originX: event.clientX - bounds.left,
                    originY: event.clientY - bounds.top
                });
            }, { capture: true, passive: false });
            chart.on('click', (params) => {
                if (params.seriesType !== 'tree' || params.data?.pairId === undefined) return;

                if (selectedPairId === params.data.pairId) {
                    chart.dispatchAction({
                        type: 'downplay',
                        seriesIndex: 0,
                        dataIndex: selectedPairIndices
                    });
                    selectedPairId = null;
                    selectedPairIndices = [];
                    return;
                }

                if (selectedPairIndices.length) {
                    chart.dispatchAction({
                        type: 'downplay',
                        seriesIndex: 0,
                        dataIndex: selectedPairIndices
                    });
                }
                selectedPairIndices = (params.treePathInfo || [])
                    .slice(1)
                    .map((node) => node.dataIndex)
                    .filter(Number.isInteger);
                if (!selectedPairIndices.includes(params.dataIndex)) {
                    selectedPairIndices.push(params.dataIndex);
                }
                selectedPairId = params.data.pairId;
                chart.dispatchAction({
                    type: 'highlight',
                    seriesIndex: 0,
                    dataIndex: selectedPairIndices
                });
            });
            resizeHandler = () => chart.resize();
            window.addEventListener('resize', resizeHandler);
        } catch (error) {
            if (chart && !chart.isDisposed()) {
                chart.dispose();
            }
            chartInstance = null;
            resizeHandler = null;
            const mainDiv = document.getElementById('main');
            const errorMessage = error && error.message ? error.message : String(error);
            mainDiv.textContent = `Error: ${errorMessage}`;
            mainDiv.className = 'error';
            console.error(error);
        }
    }

    init();
</script>
</body>
</html>
