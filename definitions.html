<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban Surface Definitions</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'CustomFont', sans-serif;
            background: #191919;
            color: #e0e0e0;
        }

        #main {
            width: 100%;
            height: 100vh;
            background: #191919;
            overflow: auto;
        }

        #diagram {
            min-width: 1100px;
        }

        .error {
            color: #ff6b6b;
            padding: 16px;
            font-family: Arial, sans-serif;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
</head>
<body>
<div id="main"></div>

<script>
    let chartInstance = null;
    let resizeHandler = null;
    let selectedPairId = null;
    let selectedPairIndices = [];

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function wrapText(text, maxCharsPerLine = 56) {
        if (!text) return '';
        const words = text.trim().split(/\s+/);
        const lines = [];
        let currentLine = '';

        words.forEach((word) => {
            const candidate = currentLine ? `${currentLine} ${word}` : word;
            if (candidate.length <= maxCharsPerLine) {
                currentLine = candidate;
            } else {
                if (currentLine) lines.push(currentLine);
                currentLine = word;
            }
        });

        if (currentLine) lines.push(currentLine);
        return lines.join('\n');
    }

    async function init() {
        if (resizeHandler) {
            window.removeEventListener('resize', resizeHandler);
            resizeHandler = null;
        }
        if (chartInstance && !chartInstance.isDisposed()) {
            chartInstance.dispose();
            chartInstance = null;
        }
        selectedPairId = null;
        selectedPairIndices = [];

        let chart = null;
        try {
            const response = await fetch('data.json');
            if (!response.ok) {
                throw new Error(`Failed to fetch data.json: ${response.statusText}`);
            }

            const data = await response.json();
            const lastName = (name) => name.trim().split(/\s+/).pop() || '';
            const peopleWithDefinitions = (data.nodes || [])
                .filter((node) => node && typeof node.name === 'string' && node.definition && String(node.definition).trim())
                .sort((a, b) => lastName(a.name).localeCompare(lastName(b.name)) || a.name.localeCompare(b.name));

            const shuffledDefinitions = peopleWithDefinitions.map((person, pairId) => ({
                person,
                pairId
            }));
            for (let index = shuffledDefinitions.length - 1; index > 0; index -= 1) {
                const swapIndex = Math.floor(Math.random() * (index + 1));
                [shuffledDefinitions[index], shuffledDefinitions[swapIndex]] =
                    [shuffledDefinitions[swapIndex], shuffledDefinitions[index]];
            }
            if (
                shuffledDefinitions.length > 1 &&
                shuffledDefinitions.every((entry, index) => entry.pairId === index)
            ) {
                shuffledDefinitions.push(shuffledDefinitions.shift());
            }

            const definitionRows = shuffledDefinitions.map((entry) => {
                const wrappedDefinition = wrapText(entry.person.definition, 56);
                const rowHeight = wrappedDefinition.split('\n').length * 13 + 12;
                return { ...entry, wrappedDefinition, rowHeight };
            });
            const diagramHeight = Math.max(
                700,
                96 + definitionRows.reduce((height, row) => height + row.rowHeight + 16, 0)
            );
            const mainDiv = document.getElementById('main');
            const chartWidth = Math.max(1100, mainDiv.clientWidth);
            let definitionY = 48;
            definitionRows.forEach((row) => {
                row.y = definitionY + row.rowHeight / 2;
                definitionY += row.rowHeight + 16;
            });

            const diagram = document.createElement('div');
            diagram.id = 'diagram';
            diagram.style.width = `${chartWidth}px`;
            diagram.style.height = `${diagramHeight}px`;
            mainDiv.replaceChildren(diagram);

            const definitionNodes = definitionRows.map((row) => ({
                id: `definition-${row.pairId}`,
                name: row.wrappedDefinition,
                pairId: row.pairId,
                x: chartWidth - 520,
                y: row.y,
                symbolSize: 1,
                label: {
                    show: true,
                    position: 'right',
                    align: 'left',
                    width: 500,
                    overflow: 'break',
                    fontSize: 10,
                    lineHeight: 13,
                    color: '#bdbdbd',
                    fontFamily: 'CustomFont, sans-serif'
                }
            }));
            const personNodes = peopleWithDefinitions.map((person, pairId) => ({
                id: `person-${pairId}`,
                name: person.name,
                pairId,
                x: 250,
                y: peopleWithDefinitions.length === 1
                    ? diagramHeight / 2
                    : 48 + pairId * (diagramHeight - 96) / (peopleWithDefinitions.length - 1),
                symbolSize: 1,
                label: {
                    show: true,
                    position: 'left',
                    align: 'right',
                    fontSize: 12,
                    color: '#d7d7d7',
                    fontFamily: 'CustomFont, sans-serif'
                }
            }));
            const graphNodes = [...personNodes, ...definitionNodes];
            const links = peopleWithDefinitions.map((person, pairId) => ({
                source: `person-${pairId}`,
                target: `definition-${pairId}`
            }));

            chart = echarts.init(diagram);
            chartInstance = chart;
            const option = {
                backgroundColor: '#191919',
                tooltip: {
                    show: false
                },
                series: [
                    {
                        type: 'graph',
                        layout: 'none',
                        data: graphNodes,
                        links,
                        left: 0,
                        top: 0,
                        right: 0,
                        bottom: 0,
                        roam: false,
                        edgeSymbol: ['none', 'none'],
                        lineStyle: {
                            color: '#666666',
                            width: 1,
                            opacity: 0.65,
                            curveness: 0.35
                        },
                        emphasis: {
                            focus: 'adjacency',
                            label: {
                                fontSize: 14,
                                lineHeight: 18
                            },
                            lineStyle: { opacity: 1, width: 2 }
                        }
                    }
                ]
            };

            chart.setOption(option);
            chart.on('click', (params) => {
                if (params.seriesType !== 'graph' || params.dataType !== 'node' || params.data?.pairId === undefined) return;

                if (selectedPairId === params.data.pairId) {
                    chart.dispatchAction({
                        type: 'downplay',
                        seriesIndex: 0,
                        dataType: 'node',
                        dataIndex: selectedPairIndices
                    });
                    selectedPairId = null;
                    selectedPairIndices = [];
                    return;
                }

                if (selectedPairIndices.length) {
                    chart.dispatchAction({
                        type: 'downplay',
                        seriesIndex: 0,
                        dataType: 'node',
                        dataIndex: selectedPairIndices
                    });
                }
                selectedPairIndices = [params.data.pairId, peopleWithDefinitions.length + params.data.pairId];
                selectedPairId = params.data.pairId;
                chart.dispatchAction({
                    type: 'highlight',
                    seriesIndex: 0,
                    dataType: 'node',
                    dataIndex: selectedPairIndices
                });
            });
            resizeHandler = () => {
                chart.resize();
            };
            window.addEventListener('resize', resizeHandler);
        } catch (error) {
            if (chart && !chart.isDisposed()) {
                chart.dispose();
            }
            chartInstance = null;
            resizeHandler = null;
            const mainDiv = document.getElementById('main');
            const errorMessage = error && error.message ? error.message : String(error);
            mainDiv.textContent = `Error: ${errorMessage}`;
            mainDiv.className = 'error';
            console.error(error);
        }
    }

    init();
</script>
</body>
</html>
