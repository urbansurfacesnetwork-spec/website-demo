<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manifesto - USRN</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'CustomFont', sans-serif;
            font-size: 21px;
            margin: 0;
            padding: 20px;
            background-color: #1a0033;
            color: #e8d5ff;
            box-sizing: border-box;
        }

        #main {
            width: 100%;
            height: 300px;
            background-color: transparent;
        }

        .error {
            color: #cc66ff;
            padding: 0px;
            background-color: transparent;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>

<div id="main"></div>

<script>
    const categoryColors = {
        0: '#9b59b6',
        1: '#7d3c98',
        2: '#a569bd',
        3: '#6c3483',
        4: '#c39bd3',
        5: '#4a235a'
    };

    function hexToRgba(hex, alpha) {
        const normalized = hex.replace('#', '');
        const bigint = parseInt(normalized, 16);
        const r = (bigint >> 16) & 255;
        const g = (bigint >> 8) & 255;
        const b = bigint & 255;
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    async function init() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error(`Failed to fetch data.json: ${response.statusText}`);
            const data = await response.json();

            const chartDom = document.getElementById('main');
            const myChart = echarts.init(chartDom);

            const CENTER_NODE = 'Urban Surfaces';
            const categoryNodes = data.categories.map((category, index) => ({
                name: category.name,
                symbol: 'rect',
                symbolSize: [52.5, 52.5],
                itemStyle: {
                    color: hexToRgba(categoryColors[index], 1),
                    borderWidth: 0
                },
                label: {
                    show: true,
                    fontFamily: 'CustomFont, sans-serif',
                    fontWeight: 'bold',
                    color: '#e8d5ff'
                }
            }));

            const centralNode = {
                name: CENTER_NODE,
                symbol: 'rect',
                symbolSize: 45,
                itemStyle: {
                    color: 'transparent',
                    borderColor: 'transparent',
                    borderWidth: 0
                },
                label: {
                    show: true,
                    fontFamily: 'CustomFont, sans-serif',
                    fontWeight: 'bold',
                    color: '#e8d5ff',
                    fontSize: 9
                },
                x: 0,
                y: 0
            };

            const nodes = [...categoryNodes, centralNode];

            // Connect all six category nodes to the central node
            const links = data.categories.map(category => ({
                source: category.name,
                target: CENTER_NODE
            }));

            // Connect each category to every other category
            for (let i = 0; i < data.categories.length; i++) {
                for (let j = i + 1; j < data.categories.length; j++) {
                    links.push({
                        source: data.categories[i].name,
                        target: data.categories[j].name
                    });
                }
            }

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        if (params.dataType === 'node') {
                            if (params.data.name === CENTER_NODE) {
                                return `<b>${params.data.name}</b>`;
                            }
                            return `<b>${params.data.name}</b>`;
                        }
                        return '';
                    }
                },
                series: [{
                    type: 'graph',
                    layout: 'circular',
                    roam: true,
                    label: {
                        show: true,
                        position: 'inside',
                        fontSize: 8,
                        fontFamily: 'CustomFont, sans-serif',
                        color: '#e8d5ff'
                    },
                    data: nodes,
                    links: links,
                    lineStyle: {
                        color: '#c39bd3',
                        opacity: 1,
                        width: 1,
                        curveness: 0.3
                    }
                }]
            };

            myChart.setOption(option);
            window.addEventListener('resize', () => myChart.resize());

        } catch (err) {
            console.error('Initialization failed:', err);
            const mainDiv = document.getElementById('main');
            mainDiv.innerHTML = `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
            mainDiv.style.height = 'auto';
        }
    }

    init();
</script>

</body>
</html>
