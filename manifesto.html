<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manifesto - USRN</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'CustomFont', sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #191919;
            color: #ffffff;
            box-sizing: border-box;
        }

        #main {
            width: 100%;
            height: 600px;
            background-color: transparent;
        }

        #descriptions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-top: 40px;
        }

        .desc-card {
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.04);
        }

        .desc-card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffffff;
        }

        .desc-card p {
            margin: 0;
            font-size: 13px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.75);
        }

        .error {
            color: #ff6b6b;
            padding: 0px;
            background-color: transparent;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>

<div id="main"></div>
<div id="descriptions"></div>

<script>
    const categoryColors = {
        0: '#f5e6ba',
        1: '#acf2c9',
        2: '#fdc5f5',
        3: '#8093f1',
        4: '#72ddf7',
        5: '#00695c'
    };

    async function init() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error(`Failed to fetch data.json: ${response.statusText}`);
            const data = await response.json();

            const chartDom = document.getElementById('main');
            const myChart = echarts.init(chartDom);

            const CENTER_NODE = 'Urban Surfaces';

            const categoryNodes = data.categories.map((category, index) => ({
                name: category.name,
                symbol: 'roundRect',
                symbolSize: 70,
                itemStyle: {
                    color: categoryColors[index],
                    borderWidth: 0
                },
                label: {
                    show: true,
                    fontFamily: 'CustomFont, sans-serif',
                    fontWeight: 'bold',
                    color: '#ffffff'
                }
            }));

            const centralNode = {
                name: CENTER_NODE,
                symbol: 'roundRect',
                symbolSize: 90,
                itemStyle: {
                    color: '#9775FD',
                    borderWidth: 0
                },
                label: {
                    show: true,
                    fontFamily: 'CustomFont, sans-serif',
                    fontWeight: 'bold',
                    color: '#ffffff',
                    fontSize: 14
                },
                x: 0,
                y: 0
            };

            const nodes = [...categoryNodes, centralNode];

            // Connect all six category nodes to the central node
            const links = data.categories.map(category => ({
                source: category.name,
                target: CENTER_NODE
            }));

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        if (params.dataType === 'node') {
                            return `<b>${params.data.name}</b>`;
                        }
                        return '';
                    }
                },
                series: [{
                    type: 'graph',
                    layout: 'circular',
                    roam: true,
                    label: {
                        show: true,
                        position: 'inside',
                        fontSize: 12,
                        fontFamily: 'CustomFont, sans-serif',
                        color: '#ffffff'
                    },
                    data: nodes,
                    links: links,
                    lineStyle: {
                        color: '#ffffff',
                        opacity: 0.3,
                        width: 1,
                        curveness: 0.3
                    }
                }]
            };

            myChart.setOption(option);
            window.addEventListener('resize', () => myChart.resize());

            // Populate description cards from data.json
            const descriptionsDiv = document.getElementById('descriptions');
            data.categories.forEach((category, index) => {
                const card = document.createElement('div');
                card.className = 'desc-card';
                const dot = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${categoryColors[index]};margin-right:8px;vertical-align:middle;"></span>`;
                card.innerHTML = `<h3>${dot}${category.name}</h3><p>${category.description || ''}</p>`;
                descriptionsDiv.appendChild(card);
            });

        } catch (err) {
            console.error('Initialization failed:', err);
            const mainDiv = document.getElementById('main');
            mainDiv.innerHTML = `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
            mainDiv.style.height = 'auto';
        }
    }

    init();
</script>

</body>
</html>
