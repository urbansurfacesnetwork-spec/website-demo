<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manifesto - USRN</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'CustomFont', sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #191919;
            color: #e0e0e0;
        }

        #main {
            width: 100%;
            height: 800px;
            background-color: transparent;
        }

        .error {
            color: #ff6b6b;
            padding: 0px;
            background-color: transparent;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>

<div id="main"></div>

<script>
    const categoryColors = {
        0: '#f5e6ba',
        1: '#acf2c9',
        2: '#fdc5f5',
        3: '#8093f1',
        4: '#72ddf7',
        5: '#00695c'
    };

    async function init() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error(`Failed to fetch data.json: ${response.statusText}`);
            const data = await response.json();

            const chartDom = document.getElementById('main');
            const myChart = echarts.init(chartDom);

            const nodes = data.categories.map((category, index) => ({
                name: category.name,
                symbol: 'circle',
                symbolSize: 60,
                itemStyle: {
                    color: categoryColors[index],
                    borderColor: '#fff',
                    borderWidth: 0
                },
                label: {
                    show: true,
                    fontFamily: 'CustomFont, sans-serif',
                    fontWeight: 'bold',
                    color: '#191919'
                }
            }));

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        if (params.dataType === 'node') {
                            return `<b>${params.data.name}</b>`;
                        }
                        return '';
                    }
                },
                series: [{
                    type: 'graph',
                    layout: 'circular',
                    roam: true,
                    label: {
                        show: true,
                        position: 'inside',
                        fontSize: 12,
                        fontFamily: 'CustomFont, sans-serif',
                        color: '#191919'
                    },
                    data: nodes,
                    links: [],
                    lineStyle: {
                        opacity: 0
                    }
                }]
            };

            myChart.setOption(option);
            window.addEventListener('resize', () => myChart.resize());
        } catch (err) {
            console.error('Initialization failed:', err);
            const mainDiv = document.getElementById('main');
            mainDiv.innerHTML = `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
            mainDiv.style.height = 'auto';
        }
    }

    init();
</script>

</body>
</html>
