<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manifesto - USRN</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'CustomFont', sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #191919;
            color: #ffffff;
            box-sizing: border-box;
        }

        #main {
            width: 100%;
            height: 600px;
            background-color: transparent;
        }

        #descriptions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-top: 40px;
        }

        .desc-card {
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.04);
        }

        .desc-card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #ffffff;
        }

        .desc-card p {
            margin: 0;
            font-size: 13px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.75);
        }

        .error {
            color: #ff6b6b;
            padding: 0px;
            background-color: transparent;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>

<div id="main"></div>
<div id="descriptions"></div>

<script>
    const categoryColors = {
        0: '#f5e6ba',
        1: '#acf2c9',
        2: '#fdc5f5',
        3: '#8093f1',
        4: '#72ddf7',
        5: '#00695c'
    };

    const categoryDescriptions = {
        'Materiality': 'Urban surfaces are physical. Every material choice — concrete, glass, timber, paint — carries embodied energy, a lifespan, and a cultural signal. Materiality asks us to consider what cities are made of, and what those choices mean for durability, identity, and environmental impact over time.',
        'Economy': 'The economics of urban surfaces govern who builds, who maintains, and who benefits. From public procurement to private development, financial flows shape what gets built and what decays. Economy examines value beyond cost — the social returns of well-maintained, equitable, and beautiful public surfaces.',
        'Governance': 'Who decides what urban surfaces look like? Governance maps the rules, institutions, and authorities that regulate public space. Planning codes, maintenance contracts, and community rights all intersect here. Good governance ensures surfaces reflect collective values rather than narrow interests or bureaucratic inertia.',
        'Communication': 'Surfaces speak. Signage, murals, texture, and colour communicate identity, ownership, and invitation. Communication explores how urban surfaces transmit meaning — from wayfinding to political expression — and how communities can reclaim the visual language of their streets and public spaces.',
        'Labour': 'Urban surfaces require constant human effort to build, clean, repair, and renew. Labour recognises the workers who sustain our cities — often invisible, often precarious. Valuing their expertise and ensuring fair conditions is central to any serious commitment to high-quality, resilient urban environments.',
        'Ecology': 'Every surface is an ecological actor. Pavements affect drainage; green roofs support biodiversity; heat-absorbing materials raise temperatures. Ecology reframes urban surfaces as part of living systems, asking how material choices can support climate resilience, reduce pollution, and make space for non-human life.'
    };

    async function init() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error(`Failed to fetch data.json: ${response.statusText}`);
            const data = await response.json();

            const chartDom = document.getElementById('main');
            const myChart = echarts.init(chartDom);

            const nodes = data.categories.map((category, index) => ({
                name: category.name,
                symbol: 'circle',
                symbolSize: 60,
                itemStyle: {
                    color: categoryColors[index],
                    borderColor: '#ffffff',
                    borderWidth: 2
                },
                label: {
                    show: true,
                    fontFamily: 'CustomFont, sans-serif',
                    fontWeight: 'bold',
                    color: '#ffffff'
                }
            }));

            // Build full mesh: connect every node to every other node
            const links = [];
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    links.push({ source: nodes[i].name, target: nodes[j].name });
                }
            }

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        if (params.dataType === 'node') {
                            return `<b>${params.data.name}</b>`;
                        }
                        return '';
                    }
                },
                series: [{
                    type: 'graph',
                    layout: 'circular',
                    roam: true,
                    label: {
                        show: true,
                        position: 'inside',
                        fontSize: 12,
                        fontFamily: 'CustomFont, sans-serif',
                        color: '#ffffff'
                    },
                    data: nodes,
                    links: links,
                    lineStyle: {
                        color: '#ffffff',
                        opacity: 0.3,
                        width: 1
                    }
                }]
            };

            myChart.setOption(option);
            window.addEventListener('resize', () => myChart.resize());

            // Populate description cards
            const descriptionsDiv = document.getElementById('descriptions');
            data.categories.forEach((category, index) => {
                const card = document.createElement('div');
                card.className = 'desc-card';
                const dot = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${categoryColors[index]};margin-right:8px;vertical-align:middle;"></span>`;
                card.innerHTML = `<h3>${dot}${category.name}</h3><p>${categoryDescriptions[category.name] || ''}</p>`;
                descriptionsDiv.appendChild(card);
            });

        } catch (err) {
            console.error('Initialization failed:', err);
            const mainDiv = document.getElementById('main');
            mainDiv.innerHTML = `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
            mainDiv.style.height = 'auto';
        }
    }

    init();
</script>

</body>
</html>
