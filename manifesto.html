<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manifesto - USRN</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'CustomFont', sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #191919;
            color: #ffffff;
            box-sizing: border-box;
        }

        #main {
            width: 100%;
            height: 600px;
            background-color: transparent;
        }

        .error {
            color: #ff6b6b;
            padding: 0px;
            background-color: transparent;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>

<div id="main"></div>

<script>
    const categoryColors = {
        0: '#f5e6ba',
        1: '#acf2c9',
        2: '#fdc5f5',
        3: '#8093f1',
        4: '#72ddf7',
        5: '#00695c'
    };

    async function init() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error(`Failed to fetch data.json: ${response.statusText}`);
            const data = await response.json();

            const chartDom = document.getElementById('main');
            const myChart = echarts.init(chartDom);

            const CENTER_NODE = 'Urban Surfaces';
            const descriptionByName = Object.fromEntries(
                data.categories.map(category => [category.name, category.description || ''])
            );

            const categoryNodes = data.categories.map((category, index) => ({
                name: category.name,
                symbol: 'rect',
                symbolSize: [105, 105],
                itemStyle: {
                    color: categoryColors[index],
                    borderWidth: 0
                },
                label: {
                    show: true,
                    fontFamily: 'CustomFont, sans-serif',
                    fontWeight: 'bold',
                    color: '#ffffff'
                }
            }));

            const centralNode = {
                name: CENTER_NODE,
                symbol: 'rect',
                symbolSize: 90,
                itemStyle: {
                    color: 'transparent',
                    borderColor: 'transparent',
                    borderWidth: 0
                },
                label: {
                    show: true,
                    fontFamily: 'CustomFont, sans-serif',
                    fontWeight: 'bold',
                    color: '#ffffff',
                    fontSize: 14
                },
                x: 0,
                y: 0
            };

            const nodes = [...categoryNodes, centralNode];

            // Connect all six category nodes to the central node
            const links = data.categories.map(category => ({
                source: category.name,
                target: CENTER_NODE
            }));

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        if (params.dataType === 'node') {
                            if (params.data.name === CENTER_NODE) {
                                return `<b>${params.data.name}</b>`;
                            }
                            const description = descriptionByName[params.data.name];
                            return `<b>${params.data.name}</b>${description ? `<br>${description}` : ''}`;
                        }
                        return '';
                    }
                },
                series: [{
                    type: 'graph',
                    layout: 'circular',
                    roam: true,
                    label: {
                        show: true,
                        position: 'inside',
                        fontSize: 12,
                        fontFamily: 'CustomFont, sans-serif',
                        color: '#ffffff'
                    },
                    data: nodes,
                    links: links,
                    lineStyle: {
                        color: '#ffffff',
                        opacity: 0.3,
                        width: 1,
                        curveness: 0.3
                    }
                }]
            };

            myChart.setOption(option);
            window.addEventListener('resize', () => myChart.resize());

        } catch (err) {
            console.error('Initialization failed:', err);
            const mainDiv = document.getElementById('main');
            mainDiv.innerHTML = `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
            mainDiv.style.height = 'auto';
        }
    }

    init();
</script>

</body>
</html>
