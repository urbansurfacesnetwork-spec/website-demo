<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USRN Researcher World Map</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
        }

        #data-source-note {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        #data-source-note.live {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        #data-source-note.placeholder {
            background-color: #fff8e1;
            color: #f57f17;
            border: 1px solid #ffe082;
        }

        #map-container {
            width: 100%;
            height: 600px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            background-color: white;
        }

        #data-summary {
            margin-top: 16px;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            background-color: white;
        }

        #data-summary h2 {
            margin: 0 0 8px;
            font-size: 18px;
            color: #333;
        }

        #data-summary p {
            margin: 0 0 12px;
            color: #555;
            line-height: 1.5;
        }

        #data-summary ul {
            margin: 0;
            padding-left: 20px;
        }

        #data-summary li {
            margin-bottom: 8px;
            color: #333;
        }

        .nav-links {
            margin-top: 16px;
            font-size: 14px;
        }

        .nav-links a {
            color: #1f77b4;
            text-decoration: none;
            margin-right: 16px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        #error-msg {
            display: none;
            color: #d32f2f;
            padding: 12px;
            background-color: #ffebee;
            border-radius: 4px;
            margin-bottom: 12px;
        }
    </style>
</head>

<div id="error-msg"></div>

<div class="nav-links">
    <a href="index.html">← Back to Network Graph</a>
    <a href="about.html">About</a>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

        "krakow":          [ 19.9450,  50.0647],
        "wroclaw":         [ 17.0385,  51.1079],
        "poznan":          [ 16.9252,  52.4064],
        "tallinn":         [ 24.7536,  59.4370],
        "riga":            [ 24.1052,  56.9496],
        "vilnius":         [ 25.2797,  54.6872],
        "minsk":           [ 27.5615,  53.9045],
        "kyiv":            [ 30.5238,  50.4501],
        "bucharest":       [ 26.1025,  44.4268],
        "sofia":           [ 23.3219,  42.6977],
        "belgrade":        [ 20.4612,  44.8176],
        "zagreb":          [ 15.9819,  45.8150],
        "sarajevo":        [ 18.4131,  43.8563],
        "skopje":          [ 21.4361,  41.9981],
        "tirana":          [ 19.8189,  41.3317],
        "reykjavik":       [-21.9426,  64.1466]
    };

    // Placeholder dataset – 5 world cities with mock researcher names.
    // ⚠️ PLACEHOLDER — replace with real researcher data.
    const PLACEHOLDER_DATA = [
        { name: "Researcher A (placeholder)", city: "London",    value: CITY_COORDS["london"]    },
        { name: "Researcher B (placeholder)", city: "New York",  value: CITY_COORDS["new york"]  },
        { name: "Researcher C (placeholder)", city: "Tokyo",     value: CITY_COORDS["tokyo"]     },
        { name: "Researcher D (placeholder)", city: "Melbourne", value: CITY_COORDS["melbourne"] },
        { name: "Researcher E (placeholder)", city: "Berlin",    value: CITY_COORDS["berlin"]    },
    ];

    // ── Remote data.json URL ─────────────────────────────────────────────────
    // Attempts to read from the urbansurfaces repository first.
    const REMOTE_DATA_URL =
        'https://raw.githubusercontent.com/urbansurfacesnetwork-spec/urbansurfaces/main/data.json';
    const LOCAL_DATA_URL = 'data.json';
    const DATA_FILE_LABEL = 'data.json';
    const PREVIEW_ITEM_LIMIT = 10;

    // ── Helpers ──────────────────────────────────────────────────────────────
    function showNote(text, type) {
        const el = document.getElementById('data-source-note');
        el.textContent = text;
        el.className = type;
    }

    function showError(text) {
        const el = document.getElementById('error-msg');
        el.style.display = 'block';
        el.textContent = text;
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;')
            .replace(/`/g, '&#96;')
            .replace(/\//g, '&#47;');
    }

    function pluralize(count, singular, plural) {
        return count === 1 ? singular : plural;
    }

    function extractCoords(item) {
        let coords = null;

        if (Array.isArray(item?.value)) {
            coords = item.value;
        } else if (Array.isArray(item?.coords)) {
            coords = item.coords;
        }

        if (!Array.isArray(coords) || coords.length < 2) return null;

        const [lon, lat] = coords;
        return Number.isFinite(lon) && Number.isFinite(lat) ? [lon, lat] : null;
    }

    function renderSummary(nodes, resolvedCount, unknownCount, usedPlaceholder) {
        const el = document.getElementById('data-summary');

        if (!Array.isArray(nodes) || nodes.length === 0) {
            el.innerHTML = usedPlaceholder
                ? `<h2>Map fallback</h2><p>Showing placeholder locations because <code>${DATA_FILE_LABEL}</code> could not be loaded.</p>`
                : `<h2>Researchers from ${DATA_FILE_LABEL}</h2><p>No researcher records were available.</p>`;
            return;
        }

        const previewItems = nodes.slice(0, PREVIEW_ITEM_LIMIT).map(node => {
            const name = escapeHtml(
                typeof node?.name === 'string' && node.name.trim()
                    ? node.name.trim()
                    : 'Unnamed researcher'
            );
            const booklet = escapeHtml(
                typeof node?.booklet === 'string' && node.booklet.trim()
                    ? node.booklet.trim()
                    : 'No booklet listed'
            );
            const location = escapeHtml(
                typeof node?.location === 'string' && node.location.trim()
                    ? node.location.trim()
                    : 'Unknown'
            );

            return `<li><strong>${name}</strong> — ${booklet}; location: ${location}</li>`;
        }).join('');

        const remainingCount = Math.max(nodes.length - PREVIEW_ITEM_LIMIT, 0);
        const remainingText = remainingCount > 0
            ? `<p>Plus ${remainingCount} more researchers in <code>${DATA_FILE_LABEL}</code>.</p>`
            : '';

        el.innerHTML = `
            <h2>Researchers from ${DATA_FILE_LABEL}</h2>
            <p>
                Loaded ${nodes.length} researchers. ${resolvedCount} ${pluralize(resolvedCount, 'has', 'have')}
                map coordinates and ${unknownCount} ${pluralize(unknownCount, 'entry is', 'entries are')}
                missing or using an unmapped location.
            </p>
            <ul>${previewItems}</ul>
            ${remainingText}
        `;
    }

    /**
     * Convert a location string from the data into [lon, lat] or null.
     * Tries the CITY_COORDS lookup after normalising the string.
     */
    function resolveCoords(location) {
        if (typeof location !== 'string') return null;

        const trimmed = location.trim();
        if (!trimmed || trimmed.toLowerCase() === 'unknown') return null;

        // If the field already looks like "lat,lon" numeric pair, parse it.
        // Expected format: "lat, lon" where lat is in [-90, 90] and lon is in [-180, 180].
        const numPair = trimmed.match(/^(-?\d+\.?\d*)\s*[,;]\s*(-?\d+\.?\d*)$/);
        if (numPair) {
            const parsedFirstValue = parseFloat(numPair[1]);
            const parsedSecondValue = parseFloat(numPair[2]);
            // Validate ranges before assuming [lat, lon] → convert to [lon, lat]
            if (Math.abs(parsedFirstValue) <= 90 && Math.abs(parsedSecondValue) <= 180) {
                return [parsedSecondValue, parsedFirstValue];
            }
            // Invalid coordinate range — skip rather than guess
            return null;
        }

        const key = trimmed.toLowerCase();
        if (CITY_COORDS[key]) return CITY_COORDS[key];

        // Partial match: location string starts with the city key (minimum 4 chars
        // to avoid spurious matches like "new" → "newcastle").
        for (const [cityKey, coords] of Object.entries(CITY_COORDS)) {
            if (cityKey.length >= 4 && key.startsWith(cityKey)) return coords;
        }
        return null;
    }

    /**
     * Convert raw nodes array into map-ready items.
     * Returns { items, unknownCount }.
     */
    function buildMapItems(nodes) {
        const items = [];
        let unknownCount = 0;
        for (const node of Array.isArray(nodes) ? nodes : []) {
            const name = typeof node?.name === 'string' && node.name.trim()
                ? node.name.trim()
                : 'Unnamed researcher';
            const city = typeof node?.location === 'string' && node.location.trim()
                ? node.location.trim()
                : 'Unknown';
            const coords = resolveCoords(node?.location);
            if (coords) {
                items.push({ name, city, value: coords });
            } else {
                unknownCount++;
            }
        }
        return { items, unknownCount };
    }

    // ── Fetch helpers ────────────────────────────────────────────────────────
    async function tryFetch(url) {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status} from ${url}`);
        return resp.json();
    }

    // ── ECharts initialisation ───────────────────────────────────────────────
    async function initChart(mapItems, isPlaceholder) {
        // Load world GeoJSON and register map.
        // The world.json file is pure GeoJSON data (not ECharts code), so using
        // the echarts@4 package path on jsDelivr is safe with any ECharts version.
        let worldJson;
        try {
            const resp = await fetch(
                'https://cdn.jsdelivr.net/npm/echarts@4/map/json/world.json'
            );
            worldJson = await resp.json();
        } catch (e) {
            showError('Could not load world map GeoJSON. Check your internet connection.');
            return;
        }
        echarts.registerMap('world', worldJson);

        const chart = echarts.init(document.getElementById('map-container'));

        // Symbol sizing constants
        const MIN_SYMBOL_SIZE = 8;
        const MAX_SYMBOL_SIZE = 20;
        const SIZE_SCALE_FACTOR = 4;

        const seriesData = (Array.isArray(mapItems) ? mapItems : []).flatMap(item => {
            const coords = extractCoords(item);
            if (!coords) return [];

            return [{
                name: typeof item?.name === 'string' && item.name.trim()
                    ? item.name.trim()
                    : 'Unnamed researcher',
                // value[0..1] = [lon, lat]; value[2] = weight (1 per researcher, used for symbol size)
                value: [...coords, 1],
                city: typeof item?.city === 'string' && item.city.trim()
                    ? item.city.trim()
                    : 'Unknown',
            }];
        });

        const option = {
            backgroundColor: '#f0f4f8',
            title: {
                text: 'USRN Researchers by Location',
                subtext: isPlaceholder
                    ? '⚠️ Showing placeholder data — update data.json with real city info'
                    : 'Live data from data.json',
                left: 'center',
                top: 10,
                textStyle: { color: '#333', fontSize: 16 },
                subtextStyle: {
                    color: isPlaceholder ? '#e65100' : '#388e3c',
                    fontSize: 12,
                },
            },
            tooltip: {
                trigger: 'item',
                formatter: params =>
                    `<strong>${params.name}</strong><br/>📍 ${params.data.city || 'Unknown'}`,
            },
            geo: {
                map: 'world',
                roam: true,
                zoom: 1.2,
                label: { show: false },
                emphasis: {
                    label: { show: false },
                    itemStyle: { areaColor: '#d0e8f5' },
                },
                itemStyle: {
                    areaColor: '#cdd9e5',
                    borderColor: '#fff',
                    borderWidth: 0.5,
                },
            },
            series: [
                {
                    name: 'Researchers',
                    type: 'effectScatter',
                    coordinateSystem: 'geo',
                    data: seriesData,
                    symbolSize: val => Math.max(MIN_SYMBOL_SIZE, Math.min(MAX_SYMBOL_SIZE, MIN_SYMBOL_SIZE + val[2] * SIZE_SCALE_FACTOR)),
                    showEffectOn: 'render',
                    rippleEffect: {
                        brushType: 'stroke',
                        scale: 3,
                        period: 4,
                    },
                    label: {
                        show: false,
                    },
                    itemStyle: {
                        color: '#1f77b4',
                        shadowBlur: 6,
                        shadowColor: 'rgba(31,119,180,0.5)',
                    },
                    emphasis: {
                        scale: true,
                        label: {
                            show: true,
                            position: 'right',
                            formatter: '{b}',
                            color: '#333',
                            fontSize: 11,
                        },
                    },
                },
            ],
        };

        chart.setOption(option);
        window.addEventListener('resize', () => chart.resize());
    }

    // ── Main ─────────────────────────────────────────────────────────────────
    async function main() {
        let nodes = null;
        let dataSource = null;

        // 1. Try remote data.json
        try {
            const json = await tryFetch(REMOTE_DATA_URL);
            if (Array.isArray(json.nodes) && json.nodes.length > 0) {
                nodes = json.nodes;
                dataSource = 'remote';
            }
        } catch (_) {
            // Remote unavailable — try local
        }

        // 2. Try local data.json
        if (!nodes) {
            try {
                const json = await tryFetch(LOCAL_DATA_URL);
                if (Array.isArray(json.nodes) && json.nodes.length > 0) {
                    nodes = json.nodes;
                    dataSource = 'local';
                }
            } catch (_) {
                // Local also unavailable
            }
        }

        // 3. Build map items
        let mapItems;
        let isPlaceholder = false;

        if (Array.isArray(nodes) && nodes.length > 0) {
            const { items, unknownCount } = buildMapItems(nodes);
            mapItems = items;
            const srcLabel = dataSource === 'remote'
                ? '🌐 Live data (remote data.json)'
                : '📂 Live data (local data.json)';
            const noteType = items.length > 0 ? 'live' : 'placeholder';
            showNote(
                items.length > 0
                    ? `${srcLabel} — ${items.length} researchers mapped` +
                        (unknownCount > 0 ? `, ${unknownCount} with unknown location` : '')
                    : `${srcLabel} — loaded ${nodes.length} researchers, but none have usable map coordinates`,
                noteType
            );
            renderSummary(nodes, items.length, unknownCount, false);
        } else {
            // No data source worked — use placeholder
            mapItems = PLACEHOLDER_DATA;
            isPlaceholder = true;
            showNote('⚠️ Placeholder data — could not load data.json', 'placeholder');
            renderSummary([], 0, 0, true);
        }

        await initChart(mapItems, isPlaceholder);
    }

    main().catch(err => {
        showError('Unexpected error: ' + err.message);
        showNote('⚠️ Error loading map', 'placeholder');
    });
</script>
