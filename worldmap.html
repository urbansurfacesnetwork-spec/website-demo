        #error-msg {

            color: #d32f2f;
            padding: 12px;
            background-color: #ffebee;
            border-radius: 4px;
            margin-bottom: 12px;

    // Placeholder dataset – 5 world cities with mock researcher names.
    // ⚠️ PLACEHOLDER — replace with real researcher data.
    const PLACEHOLDER_DATA = [
        { name: "Researcher A (placeholder)", city: "London",    coords: CITY_COORDS["london"]    },
        { name: "Researcher B (placeholder)", city: "New York",  coords: CITY_COORDS["new york"]  },
        { name: "Researcher C (placeholder)", city: "Tokyo",     coords: CITY_COORDS["tokyo"]     },
        { name: "Researcher D (placeholder)", city: "Melbourne", coords: CITY_COORDS["melbourne"] },
        { name: "Researcher E (placeholder)", city: "Berlin",    coords: CITY_COORDS["berlin"]    },
    ];

    // ── Remote data.json URL ─────────────────────────────────────────────────
    // Attempts to read from the urbansurfaces repository first.
    const REMOTE_DATA_URL =
        'https://raw.githubusercontent.com/urbansurfacesnetwork-spec/urbansurfaces/main/data.json';
    const LOCAL_DATA_URL = 'data.json';

    // ── Helpers ──────────────────────────────────────────────────────────────
    function showNote(text, type) {
        const el = document.getElementById('data-source-note');
        el.textContent = text;
        el.className = type;
    }

    function showError(text) {
        const el = document.getElementById('error-msg');
        el.style.display = 'block';
        el.textContent = text;
    }

    /**
     * Convert a location string from the data into [lon, lat] or null.
     * Tries the CITY_COORDS lookup after normalising the string.
     */
    function resolveCoords(location) {
        if (!location || location.toLowerCase() === 'unknown') return null;

        // If the field already looks like "lat,lon" or "[lon,lat]" parse it.
        const numPair = location.match(/(-?[\d.]+)\s*[,;]\s*(-?[\d.]+)/);
        if (numPair) {
            const a = parseFloat(numPair[1]);
            const b = parseFloat(numPair[2]);
            // Heuristic: assume [lat, lon] order if |a| <= 90 and |b| <= 180
            if (Math.abs(a) <= 90 && Math.abs(b) <= 180) return [b, a]; // → [lon, lat]
            return [a, b];
        }

        const key = location.trim().toLowerCase();
        if (CITY_COORDS[key]) return CITY_COORDS[key];

        // Partial match: if any key is contained in the location string
        for (const [cityKey, coords] of Object.entries(CITY_COORDS)) {
            if (key.includes(cityKey) || cityKey.includes(key)) return coords;
        }
        return null;
    }

    /**
     * Convert raw nodes array into map-ready items.
     * Returns { items, unknownCount }.
     */
    function buildMapItems(nodes) {
        const items = [];
        let unknownCount = 0;
        for (const node of nodes) {
            const coords = resolveCoords(node.location);
            if (coords) {
                items.push({ name: node.name, city: node.location, value: coords });
            } else {
                unknownCount++;
            }
        }
        return { items, unknownCount };
    }

    // ── Fetch helpers ────────────────────────────────────────────────────────
    async function tryFetch(url) {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status} from ${url}`);
        return resp.json();
    }

    // ── ECharts initialisation ───────────────────────────────────────────────
    async function initChart(mapItems, isPlaceholder) {
        // Load world GeoJSON and register map
        let worldJson;
        try {
            const resp = await fetch(
                'https://cdn.jsdelivr.net/npm/echarts@4/map/json/world.json'
            );
            worldJson = await resp.json();
        } catch (e) {
            showError('Could not load world map GeoJSON. Check your internet connection.');
            return;
        }
        echarts.registerMap('world', worldJson);

        const chart = echarts.init(document.getElementById('map-container'));

        const seriesData = mapItems.map(item => ({
            name: item.name,
            value: [...item.value, 1],
            city: item.city,
        }));

        const option = {
            backgroundColor: '#f0f4f8',
            title: {
                text: 'USRN Researchers by Location',
                subtext: isPlaceholder
                    ? '⚠️ Showing placeholder data — update data.json with real city info'
                    : 'Live data from data.json',
                left: 'center',
                top: 10,
                textStyle: { color: '#333', fontSize: 16 },
                subtextStyle: {
                    color: isPlaceholder ? '#e65100' : '#388e3c',
                    fontSize: 12,
                },
            },
            tooltip: {
                trigger: 'item',
                formatter: params =>
                    `<strong>${params.name}</strong><br/>📍 ${params.data.city || 'Unknown'}`,
            },
            geo: {
                map: 'world',
                roam: true,
                zoom: 1.2,
                label: { show: false },
                emphasis: {
                    label: { show: false },
                    itemStyle: { areaColor: '#d0e8f5' },
                },
                itemStyle: {
                    areaColor: '#cdd9e5',
                    borderColor: '#fff',
                    borderWidth: 0.5,
                },
            },
            series: [
                {
                    name: 'Researchers',
                    type: 'effectScatter',
                    coordinateSystem: 'geo',
                    data: seriesData,
                    symbolSize: val => Math.max(8, Math.min(20, 8 + val[2] * 4)),
                    showEffectOn: 'render',
                    rippleEffect: {
                        brushType: 'stroke',
                        scale: 3,
                        period: 4,
                    },
                    label: {
                        show: false,
                    },
                    itemStyle: {
                        color: '#1f77b4',
                        shadowBlur: 6,
                        shadowColor: 'rgba(31,119,180,0.5)',
                    },
                    emphasis: {
                        scale: true,
                        label: {
                            show: true,
                            position: 'right',
                            formatter: '{b}',
                            color: '#333',
                            fontSize: 11,
                        },
                    },
                },
            ],
        };

        chart.setOption(option);
        window.addEventListener('resize', () => chart.resize());
    }

    // ── Main ─────────────────────────────────────────────────────────────────
    async function main() {
        let nodes = null;
        let dataSource = null;

        // 1. Try remote data.json
        try {
            const json = await tryFetch(REMOTE_DATA_URL);
            if (Array.isArray(json.nodes) && json.nodes.length > 0) {
                nodes = json.nodes;
                dataSource = 'remote';
            }
        } catch (_) {
            // Remote unavailable — try local
        }

        // 2. Try local data.json
        if (!nodes) {
            try {
                const json = await tryFetch(LOCAL_DATA_URL);
                if (Array.isArray(json.nodes) && json.nodes.length > 0) {
                    nodes = json.nodes;
                    dataSource = 'local';
                }
            } catch (_) {
                // Local also unavailable
            }
        }

        // 3. Build map items
        let mapItems;
        let isPlaceholder = false;

        if (nodes) {
            const { items, unknownCount } = buildMapItems(nodes);
            if (items.length > 0) {
                mapItems = items;
                const total = nodes.length;
                const srcLabel = dataSource === 'remote'
                    ? '🌐 Live data (remote data.json)'
                    : '📂 Live data (local data.json)';
                showNote(
                    `${srcLabel} — ${items.length} researchers mapped` +
                    (unknownCount > 0 ? `, ${unknownCount} with unknown location` : ''),
                    'live'
                );
            } else {
                // All locations unknown — use placeholder
                mapItems = PLACEHOLDER_DATA;
                isPlaceholder = true;
                showNote(
                    '⚠️ Placeholder data — all researcher locations are "Unknown" in data.json',
                    'placeholder'
                );
            }
        } else {
            // No data source worked — use placeholder
            mapItems = PLACEHOLDER_DATA;
            isPlaceholder = true;
            showNote('⚠️ Placeholder data — could not load data.json', 'placeholder');
        }

        await initChart(mapItems, isPlaceholder);
    }

    main().catch(err => {
        showError('Unexpected error: ' + err.message);
        showNote('⚠️ Error loading map', 'placeholder');
    });
