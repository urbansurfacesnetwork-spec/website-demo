<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Outputs - USRN</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'CustomFont', sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #191919;
            color: #e0e0e0;
        }

        #main {
            width: 100%;
            height: 800px;
            background-color: transparent;
        }

        .error {
            color: #ff6b6b;
            padding: 0px;
            background-color: transparent;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>

<div id="main"></div>

<script>
    const bookletColors = {
        'Vol. 1': '#9D7488',
        'Vol. 2': '#B68E5D',
        'Vol. 3': '#85A8A7',
        'Vol. 4': '#81794D',
        'Vol. 5': '#5C6349',
        'Vol. 6': '#7F4343'
    };
    const DEFAULT_COLOR = '#9aa0a6';

    async function init() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error(`Failed to fetch data.json: ${response.statusText}`);
            const data = await response.json();

            // Collect unique booklet names
            const bookletSet = new Set();
            data.nodes.forEach(node => {
                if (node.booklet) {
                    node.booklet.split(',').map(b => b.trim()).forEach(b => bookletSet.add(b));
                }
            });

            const booklets = Array.from(bookletSet).sort();

            // Output (booklet) nodes
            const outputNodes = booklets.map(booklet => ({
                name: booklet,
                symbol: 'circle',
                symbolSize: 50,
                itemStyle: {
                    color: bookletColors[booklet] || DEFAULT_COLOR,
                    borderWidth: 0
                },
                label: {
                    show: true,
                    fontFamily: 'CustomFont, sans-serif',
                    fontWeight: 'bold',
                    color: '#ffffff'
                }
            }));

            // Links: connect each person to their booklet(s)
            const links = [];
            const connectedPersonNames = new Set();
            data.nodes.forEach(person => {
                if (person.booklet) {
                    person.booklet.split(',').map(b => b.trim()).forEach(booklet => {
                        if (bookletSet.has(booklet)) {
                            links.push({ source: person.name, target: booklet });
                            connectedPersonNames.add(person.name);
                        }
                    });
                }
            });

            // Person nodes — only people connected to at least one booklet
            const personNodes = data.nodes
                .filter(person => connectedPersonNames.has(person.name))
                .map(person => ({
                    name: person.name,
                    symbol: 'circle',
                    symbolSize: 20,
                    itemStyle: {
                        color: '#9aa0a6',
                        borderWidth: 0
                    },
                    label: {
                        show: true,
                        fontFamily: 'CustomFont, sans-serif',
                        fontSize: 10,
                        color: '#ffffff'
                    }
                }));

            const chartDom = document.getElementById('main');
            const myChart = echarts.init(chartDom);

            const option = {
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        if (params.dataType === 'node') {
                            const isBooklet = bookletSet.has(params.data.name);
                            if (isBooklet) {
                                const count = data.nodes.filter(n => n.booklet && n.booklet.includes(params.data.name)).length;
                                return `<b>${params.data.name}</b><br/>Contributors: ${count}`;
                            }
                            return `<b>${params.data.name}</b>`;
                        }
                        return '';
                    }
                },
                series: [{
                    type: 'graph',
                    layout: 'force',
                    roam: true,
                    force: {
                        repulsion: 120,
                        gravity: 0.1,
                        edgeLength: 80
                    },
                    label: {
                        show: true,
                        position: 'inside',
                        fontSize: 12,
                        fontFamily: 'CustomFont, sans-serif',
                        color: '#ffffff'
                    },
                    data: [...outputNodes, ...personNodes],
                    links: links,
                    lineStyle: {
                        color: '#ffffff',
                        opacity: 0.3,
                        width: 1
                    }
                }]
            };

            myChart.setOption(option);
            window.addEventListener('resize', () => myChart.resize());
        } catch (err) {
            console.error('Initialization failed:', err);
            const mainDiv = document.getElementById('main');
            mainDiv.innerHTML = `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
            mainDiv.style.height = 'auto';
        }
    }

    init();
</script>

</body>
</html>
