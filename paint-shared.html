<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint (shared) - USRN</title>
    <style>
        @font-face {
            font-family: 'Fractul';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Fractul', Arial, sans-serif;
            color: #fff;
            margin: 0;
            padding: 10px;
            background-color: transparent;
            overflow-x: hidden;
            max-width: 100vw;
        }

        #toolbar {
            display: flex;
            justify-content: center;
            max-width: 100%;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
            background: transparent;
            padding: 8px 12px;
            border: none;
        }

        #toolbar label {
            font-size: 13px;
            font-family: 'Fractul', Arial, sans-serif;
        }

        .color-swatch {
            width: 24px;
            height: 24px;
            border: 2px solid #aaa;
            border-radius: 0;
            cursor: pointer;
            display: inline-block;
            vertical-align: middle;
            transition: border-color 0.15s;
        }

        .color-swatch.active-swatch {
            border-color: #333;
            border-width: 3px;
            outline: 2px solid #fff;
            outline-offset: -4px;
        }

        .size-btn {
            padding: 3px 10px;
            font-family: 'Fractul', Arial, sans-serif;
            font-size: 13px;
            border: 1px solid #aaa;
            border-radius: 0;
            background: #997dec;
            cursor: pointer;
            transition: background 0.15s;
        }

        .size-btn:hover { background: #7d5ecc; }

        .size-btn.active-size {
            background: #997dec;
            color: #fff;
            border-color: #997dec;
        }

        .tool-btn {
            padding: 5px 12px;
            font-family: 'Fractul', Arial, sans-serif;
            font-size: 13px;
            color: #fff;
            border: 1px solid #aaa;
            border-radius: 0;
            background: #997dec;
            cursor: pointer;
            transition: background 0.15s;
        }

        .tool-btn:hover {
            background: #7d5ecc;
        }

        .tool-btn.active {
            background: #997dec;
            color: #000;
            border-color: #997dec;
        }

        .tool-btn.active-buff {
            background: #997dec;
            color: #000;
            border-color: #997dec;
        }

        .tool-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }


        #canvas-wrapper {
            position: relative;
            display: block;
            margin: 0 auto;
            border: none;
            border-radius: 0;
            background-image: url('canvas-background.png');
            background-size: 100% 100%;
            background-color: transparent;
            width: 973px;
            max-width: 100%;
            aspect-ratio: 973 / 730;
            height: auto;
        }

        #drawCanvas {
            display: block;
            cursor: crosshair;
            background: transparent;
            width: 100%;
            height: auto;
            touch-action: none;
            border-radius: 0;
            border: none;
        }

        @media (max-width: 600px) {
            body { padding: 4px; }
            #toolbar { gap: 6px; padding: 4px; }
            .tool-btn { padding: 4px 8px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div id="toolbar">
    <button class="tool-btn active" id="btnBrush">Marker</button>
    <button class="tool-btn" id="btnBrownBuff">Brown Buff</button>
    <button class="tool-btn" id="btnGreyBuff">Grey Buff</button>
    <button class="tool-btn" id="btnSticker">Sticker</button>
    <button class="tool-btn" id="btnPasteUp">Paste-Up</button>
    <button class="tool-btn" id="btnAdvertise">Advertise</button>

    <span id="colorSwatches">
        <span class="color-swatch active-swatch" data-color="#4a4a4a" style="background:#4a4a4a;" title="Charcoal"></span>
        <span class="color-swatch" data-color="#c77979" style="background:#c77979;" title="Muted red"></span>
        <span class="color-swatch" data-color="#7eaa86" style="background:#7eaa86;" title="Muted green"></span>
    </span>

    <span id="inkMeter" style="font-size:13px;">
        <span id="inkLabel">Ink</span>
        <span style="display:inline-block;width:100px;height:10px;border:1px solid #333;vertical-align:middle;background:#eee;">
            <span id="inkBar" style="display:block;height:100%;width:100%;background:#997dec;"></span>
        </span>
    </span>

    <button class="tool-btn" id="btnUndo" style="opacity:0;pointer-events:none;">Undo</button>
    <button class="tool-btn" id="btnRedo" disabled style="opacity:0;pointer-events:none;">Redo</button>

    <button class="tool-btn" id="btnEraser" style="opacity:0;pointer-events:none;">Eraser</button>
    <button class="tool-btn" id="btnClear" style="opacity:0;pointer-events:none;">Clear</button>
    <button class="tool-btn" id="btnScraper">Scraper</button>
    <button class="tool-btn" id="btnPutUp">Put it up</button>
    <span id="status" style="font-size:13px;"></span>
</div>

<div id="canvas-wrapper">
    <canvas id="drawCanvas" width="973" height="730"></canvas>
</div>

<script>
(function () {
    const canvas = document.getElementById('drawCanvas');
    const ctx = canvas.getContext('2d');

    // URL of the Cloudflare Worker endpoint. Use '/artwork' if the Worker is routed
    // on the same domain as this page, otherwise the full workers.dev URL, e.g.
    // 'https://usrn-artwork.YOURNAME.workers.dev/artwork'
    const ARTWORK_URL = '/artwork';

    // Scraper: 30px wide, 1px high comb with gaps (1px tooth every 3px)
    const SCRAPER_W = 30, SCRAPER_GAP = 3;

    // Tools
    let tool = 'brush';
    let painting = false;
    let lastX = 0, lastY = 0;
    let brushSize = 4;

    // Fixed tool sizes
    const MARKER_SIZE = 4;   // Small
    const BUFF_SIZE = 10;    // Medium

    // Custom cursors (70x70 png files in cursors/); hotspot at the centre
    const CURSOR_HOTSPOT = '35 35';
    const cursorFiles = {
        brush: 'cursors/marker.png',
        brownbuff: 'cursors/buff.png',
        greybuff: 'cursors/buff.png',
        sticker: 'cursors/sticker.png',
        pasteup: 'cursors/pasteup.png',
        advertise: 'cursors/advertise.png',
        scraper: 'cursors/scraper.png'
    };
    const fallbackCursor = { brush: 'crosshair', brownbuff: 'crosshair', greybuff: 'crosshair',
        sticker: 'copy', pasteup: 'copy', advertise: 'copy', eraser: 'cell', scraper: 'cell' };

    // Limits (scraper is unlimited)
    const MAX_COLOURS = 3;
    const MARKER_INK = 1500;   // pixels of line per colour
    const BUFF_PAINT = 500;    // brush dabs per buff
    const LIMITS = { pasteup: 10, advertise: 10, sticker: 20 };
    const usedColours = [];            // up to 3 colours the user has started using
    const inkLeft = {};                // per marker colour
    const paintLeft = { brownbuff: BUFF_PAINT, greybuff: BUFF_PAINT };
    const stampsLeft = Object.assign({}, LIMITS);
    const outOfMsg = { brush: 'ink', brownbuff: 'paint', greybuff: 'paint',
        sticker: 'stickers', pasteup: 'posters', advertise: 'adverts' };
    // Randomised faded swatch colours per page load
    const swatchEls = document.querySelectorAll('.color-swatch');
    const baseHue = Math.random() * 360;
    swatchEls.forEach((el, i) => {
        const h = Math.round((baseHue + i * 120 + (Math.random() - 0.5) * 40) % 360);
        const c = `hsl(${h}, ${25 + Math.round(Math.random() * 10)}%, ${48 + Math.round(Math.random() * 10)}%)`;
        el.dataset.color = c;
        el.style.background = c;
        el.title = 'Colour ' + (i + 1);
    });
    let color = swatchEls[0].dataset.color;

    const STICKER_ANGLES = [-30, -15, 0, 15, 30];

    // Sticker images
    const stickerImg = new Image();
    stickerImg.src = 'sticker.png';
    const pasteUpImg = new Image();
    pasteUpImg.src = 'pasteup.png';

    // Advert images (135×181 each)
    const ADVERT_W = 135, ADVERT_H = 181;
    const advertImgs = ['advert-02.png', 'advert-03.png', 'advert-04.png'].map(src => {
        const img = new Image(); img.src = src; return img;
    });
    let advertIndex = 0;

    // History for redo
    const MAX_HISTORY = 40;
    let history = [];
    let historyIndex = -1;

    function saveSnapshot() {
        history = history.slice(0, historyIndex + 1);
        history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        if (history.length > MAX_HISTORY) {
            history.shift();
        }
        historyIndex = history.length - 1;
        updateHistoryButtons();
    }

    function updateHistoryButtons() {
        document.getElementById('btnRedo').disabled = historyIndex >= history.length - 1;
        document.getElementById('btnUndo').disabled = historyIndex <= 0;
    }

    saveSnapshot();

    // Shared artwork: load, save
    const statusEl = document.getElementById('status');
    function setStatus(msg) { statusEl.textContent = msg; }

    function updateMeter() {
        const meter = document.getElementById('inkMeter');
        let frac = null, label = '';
        if (tool === 'brush') {
            label = 'Ink'; frac = (color in inkLeft ? inkLeft[color] : MARKER_INK) / MARKER_INK;
            if (!(color in inkLeft) && usedColours.length >= MAX_COLOURS) frac = 0;
        } else if (tool === 'brownbuff' || tool === 'greybuff') {
            label = 'Paint'; frac = paintLeft[tool] / BUFF_PAINT;
        } else if (stampsLeft[tool] !== undefined) {
            label = outOfMsg[tool].charAt(0).toUpperCase() + outOfMsg[tool].slice(1) + ' left: ' + stampsLeft[tool];
            frac = stampsLeft[tool] / LIMITS[tool];
        }
        meter.style.display = frac === null ? 'none' : '';
        if (frac !== null) {
            document.getElementById('inkLabel').textContent = label;
            document.getElementById('inkBar').style.width = Math.max(0, Math.min(1, frac)) * 100 + '%';
        }
    }

    // Returns true if the current tool may paint (marker colour is claimed here)
    function canPaint() {
        if (tool === 'brush') {
            if (!(color in inkLeft)) {
                if (usedColours.length >= MAX_COLOURS) {
                    setStatus('You have run out of ink!');
                    return false;
                }
                usedColours.push(color);
                inkLeft[color] = MARKER_INK;
            }
            if (inkLeft[color] <= 0) { setStatus('You have run out of ink!'); return false; }
            return true;
        }
        if (tool === 'brownbuff' || tool === 'greybuff') {
            if (paintLeft[tool] <= 0) { setStatus('You have run out of paint!'); return false; }
            return true;
        }
        if (stampsLeft[tool] !== undefined && stampsLeft[tool] <= 0) {
            setStatus('You have run out of ' + outOfMsg[tool] + '!');
            return false;
        }
        return true;
    }

    function loadArtwork() {
        fetch(ARTWORK_URL, { cache: 'no-store' })
            .then(r => r.ok ? r.blob() : null)
            .then(blob => {
                if (!blob) return null;
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = function () {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    history = [];
                    historyIndex = -1;
                    saveSnapshot();
                };
                img.onerror = function () { URL.revokeObjectURL(url); };
                img.src = url;
            })
            .catch(() => { /* no artwork yet or Worker unavailable: start blank */ });
    }
    loadArtwork();

    document.getElementById('btnPutUp').addEventListener('click', function () {
        const btn = this;
        btn.disabled = true;
        setStatus('Putting it up...');
        canvas.toBlob(function (blob) {
            if (!blob) { setStatus('Could not read canvas.'); btn.disabled = false; return; }
            fetch(ARTWORK_URL, { method: 'POST', headers: { 'Content-Type': 'image/png' }, body: blob })
                .then(r => { if (!r.ok) throw new Error(r.status); setStatus('It is up!'); })
                .catch(() => setStatus('Sorry, could not put it up.'))
                .finally(() => { btn.disabled = false; });
        }, 'image/png');
    });

    // Color swatches
    document.querySelectorAll('.color-swatch').forEach(swatch => {
        swatch.addEventListener('click', function () {
            color = this.dataset.color;
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active-swatch'));
            this.classList.add('active-swatch');
            setStatus('');
            updateMeter();
        });
    });

    // All tool button ids
    const toolBtns = ['btnBrush', 'btnBrownBuff', 'btnGreyBuff', 'btnSticker', 'btnPasteUp', 'btnAdvertise', 'btnEraser', 'btnScraper'];

    function switchTool(t) {
        tool = t;
        toolBtns.forEach(id => {
            const btn = document.getElementById(id);
            btn.classList.remove('active', 'active-buff');
        });
        const activeId = {
            brush: 'btnBrush',
            brownbuff: 'btnBrownBuff',
            greybuff: 'btnGreyBuff',
            sticker: 'btnSticker',
            pasteup: 'btnPasteUp',
            advertise: 'btnAdvertise',
            eraser: 'btnEraser',
            scraper: 'btnScraper'
        }[t];
        if (activeId) {
            document.getElementById(activeId).classList.add(
                (t === 'brownbuff' || t === 'greybuff') ? 'active-buff' : 'active'
            );
        }

        brushSize = (t === 'brownbuff' || t === 'greybuff') ? BUFF_SIZE : MARKER_SIZE;
        setStatus('');

        // Show/hide colour controls
        const colorSwatches = document.getElementById('colorSwatches');
        colorSwatches.style.display = t === 'brush' ? '' : 'none';

        const file = cursorFiles[t];
        canvas.style.cursor = file
            ? "url('" + file + "') " + CURSOR_HOTSPOT + ", " + (fallbackCursor[t] || 'crosshair')
            : (fallbackCursor[t] || 'crosshair');
        updateMeter();
    }

    document.getElementById('btnBrush').addEventListener('click', () => switchTool('brush'));
    document.getElementById('btnBrownBuff').addEventListener('click', () => switchTool('brownbuff'));
    document.getElementById('btnGreyBuff').addEventListener('click', () => switchTool('greybuff'));
    document.getElementById('btnSticker').addEventListener('click', () => switchTool('sticker'));
    document.getElementById('btnPasteUp').addEventListener('click', () => switchTool('pasteup'));
    document.getElementById('btnAdvertise').addEventListener('click', () => switchTool('advertise'));
    document.getElementById('btnEraser').addEventListener('click', () => switchTool('eraser'));
    document.getElementById('btnScraper').addEventListener('click', () => switchTool('scraper'));

    // Undo
    document.getElementById('btnUndo').addEventListener('click', function () {
        if (historyIndex > 0) {
            historyIndex--;
            ctx.putImageData(history[historyIndex], 0, 0);
            updateHistoryButtons();
        }
    });

    // Redo
    document.getElementById('btnRedo').addEventListener('click', function () {
        if (historyIndex < history.length - 1) {
            historyIndex++;
            ctx.putImageData(history[historyIndex], 0, 0);
            updateHistoryButtons();
        }
    });

    // Clear
    document.getElementById('btnClear').addEventListener('click', function () {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        saveSnapshot();
    });

    // Drawing
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const src = e.touches ? e.touches[0] : e;
        return {
            x: (src.clientX - rect.left) * scaleX,
            y: (src.clientY - rect.top) * scaleY
        };
    }

    function stampImage(img, x, y) {
        const width = img.naturalWidth || img.width;
        const height = img.naturalHeight || img.height;
        if (!width || !height) return;
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.translate(x, y);
        ctx.rotate(STICKER_ANGLES[Math.floor(Math.random() * STICKER_ANGLES.length)] * Math.PI / 180);
        ctx.drawImage(img, -width / 2, -height / 2, width, height);
        ctx.restore();
    }

    function stampPasteUp(x, y) {
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(pasteUpImg, x - ADVERT_W / 2, y - ADVERT_H / 2, ADVERT_W, ADVERT_H);
        ctx.restore();
    }

    function stampAdvert(x, y) {
        const img = advertImgs[advertIndex % advertImgs.length];
        advertIndex++;
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.drawImage(img, x - ADVERT_W / 2, y - ADVERT_H / 2, ADVERT_W, ADVERT_H);
        ctx.restore();
    }

    function drawBuff(x, y, buffColor, density = 80) {
        const radius = brushSize * 1.5;
        ctx.save();
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = buffColor;
        for (let i = 0; i < density; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * radius;
            const px = x + r * Math.cos(angle);
            const py = y + r * Math.sin(angle);
            ctx.globalAlpha = Math.random() * 0.5 + 0.2;
            ctx.beginPath();
            ctx.arc(px, py, Math.random() * 2 + 0.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.restore();
    }

    function startDraw(e) {
        e.preventDefault();
        if (!canPaint()) return;
        painting = true;
        const pos = getPos(e);
        lastX = pos.x;
        lastY = pos.y;
        draw(e);
    }

    // Spend one stamp; returns false (and stops) once the supply is gone
    function useStamp() {
        stampsLeft[tool]--;
        updateMeter();
        if (stampsLeft[tool] <= 0) {
            setStatus('You have run out of ' + outOfMsg[tool] + '!');
            painting = false;
            saveSnapshot();
        }
    }

    let scraperPattern = null;

    function draw(e) {
        if (!painting) return;
        e.preventDefault();
        const pos = getPos(e);

        if (tool === 'sticker' || tool === 'pasteup' || tool === 'advertise') {
            // One stamp per click (not per mouse move)
            if (e.type === 'mousemove' || e.type === 'touchmove') return;
            if (tool === 'sticker') stampImage(stickerImg, pos.x, pos.y);
            else if (tool === 'pasteup') stampPasteUp(pos.x, pos.y);
            else stampAdvert(pos.x, pos.y);
            useStamp();
            return;
        } else if (tool === 'brownbuff' || tool === 'greybuff') {
            if (paintLeft[tool] <= 0) { setStatus('You have run out of paint!'); painting = false; saveSnapshot(); return; }
            if (tool === 'brownbuff') drawBuff(pos.x, pos.y, '#6b4b3e', 120);
            else drawBuff(pos.x, pos.y, '#888888');
            paintLeft[tool]--;
            updateMeter();
            if (paintLeft[tool] <= 0) setStatus('You have run out of paint!');
        } else if (tool === 'scraper') {
            // Fixed-size comb, stamped only at pointer positions (no interpolation)
            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
            if (!scraperPattern || e.type === 'mousedown' || e.type === 'touchstart') {
                const w = SCRAPER_W + Math.round((Math.random() - 0.5) * 8);
                const teeth = [];
                // Short irregular runs of grouped pixels
                for (let i = 0; i < w; ) {
                    const run = 2 + Math.floor(Math.random() * 5);
                    if (Math.random() < 0.7) {
                        const dy = Math.round(Math.random() * 2 - 1);
                        for (let k = 0; k < run && i + k < w; k++) {
                            if (Math.random() < 0.12) continue;
                            teeth.push({ x: i + k, dy: dy + (Math.random() < 0.2 ? 1 : 0), h: 1 });
                        }
                    }
                    i += run + 1 + Math.floor(Math.random() * 3);
                }
                scraperPattern = { w, teeth };
            }
            const sx = Math.round(pos.x - scraperPattern.w / 2), sy = Math.round(pos.y);
            for (const t of scraperPattern.teeth) ctx.fillRect(sx + t.x, sy + t.dy, 1, t.h);
            ctx.restore();
        } else if (tool === 'eraser') {
            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineWidth = brushSize * 3;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.restore();
        } else {
            if (inkLeft[color] <= 0) { setStatus('You have run out of ink!'); painting = false; saveSnapshot(); return; }
            inkLeft[color] -= Math.max(1, Math.hypot(pos.x - lastX, pos.y - lastY));
            updateMeter();
            if (inkLeft[color] <= 0) setStatus('You have run out of ink!');
            ctx.save();
            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = color;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.restore();
        }

        lastX = pos.x;
        lastY = pos.y;
    }

    function stopDraw(e) {
        if (!painting) return;
        painting = false;
        saveSnapshot();
    }

    // Mouse
    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseleave', stopDraw);

    // Touch
    canvas.addEventListener('touchstart', startDraw, { passive: false });
    canvas.addEventListener('touchmove', draw, { passive: false });
    canvas.addEventListener('touchend', stopDraw);

    switchTool('brush');

    // Keyboard shortcut for redo
    document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && ((e.shiftKey && e.key === 'z') || e.key === 'y')) {
            document.getElementById('btnRedo').click();
        }
    });
}());
</script>

</body>
</html>
