<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>USRN Participants & Interviewees</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'CustomFont', sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #191919;
            color: #e0e0e0;
        }

        .table-section {
            margin-top: 40px;
            background-color: transparent;
            padding: 20px;
            border-radius: 8px;
            box-shadow: none;
        }

        .table-section h2 {
            margin-top: 0;
            color: #e0e0e0;
            border-bottom: 3px solid #1f77b4;
            padding-bottom: 10px;
        }

        .controls-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            align-items: flex-end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #e0e0e0;
            font-size: 14px;
        }

        .control-group input,
        .control-group select {
            padding: 8px 12px;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'CustomFont', sans-serif;
            min-width: 180px;
            background-color: #2a2a2a;
            color: #e0e0e0;
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: #1f77b4;
            box-shadow: 0 0 5px rgba(31, 119, 180, 0.5);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            font-family: 'CustomFont', sans-serif;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #resetBtn {
            background-color: #f44336;
            color: white;
        }

        #resetBtn:hover {
            background-color: #da190b;
        }

        .results-info {
            margin-bottom: 15px;
            color: #aaa;
            font-size: 14px;
        }

        .table-container {
            overflow-x: auto;
            border: 0px solid #ddd;
            border-radius: 0px;
            background-color: transparent;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
            background-color: transparent;
        }

        thead {
            background-color: #1f77b4;
            color: transparent;
            position: sticky;
            top: 0;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: bold;
            border-bottom: 2px solid #0d47a1;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background-color: #0d47a1;
        }

        th.sortable::after {
            content: " ⇅";
            opacity: 0.5;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #333;
        }

        tbody tr {
            transition: background-color 0.2s;
            background-color: rgba(255, 255, 255, 0.05);
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        tbody tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .category-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            margin-right: 5px;
            margin-bottom: 3px;
        }

        .events-cell {
            font-size: 12px;
            color: #aaa;
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 16px;
        }

        .pagination {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 6px 10px;
            background-color: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #444;
        }

        .pagination button.active {
            background-color: #1f77b4;
            color: white;
            border-color: #0d47a1;
        }

        .pagination button:hover {
            background-color: #1f77b4;
            color: white;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #5aabf0;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
            color: #7ec0f5;
        }
    </style>
</head>
<body>

<a href="index.html" class="back-link">← Back to Network Map</a>

<div class="table-section">
    <h2>Find USRN Participants &amp; Interviewees</h2>

    <div class="controls-container">
        <div class="control-group">
            <label for="searchInput">Search by Name:</label>
            <input type="text" id="searchInput" placeholder="e.g., Sabina Andron">
        </div>

        <div class="control-group">
            <label for="bookletFilter">Filter by Booklet:</label>
            <select id="bookletFilter">
                <option value="">All Booklets</option>
                <option value="Vol. 1">Vol. 1</option>
                <option value="Vol. 2">Vol. 2</option>
                <option value="Vol. 3">Vol. 3</option>
                <option value="Vol. 4">Vol. 4</option>
                <option value="Vol. 5">Vol. 5</option>
                <option value="Vol. 6">Vol. 6</option>
                <option value="null">No Booklet (Events Only)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="categoryFilter">Filter by Category:</label>
            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option value="0">Materiality</option>
                <option value="1">Economy</option>
                <option value="2">Governance</option>
                <option value="3">Communication</option>
                <option value="4">Labour</option>
                <option value="5">Ecology</option>
            </select>
        </div>

        <div class="control-group">
            <label for="locationFilter">Filter by Region:</label>
            <select id="locationFilter">
                <option value="">All Regions</option>
            </select>
        </div>

        <div class="button-group">
            <button id="resetBtn">Reset Filters</button>
        </div>
    </div>

    <div class="results-info">
        <span id="resultCount">Loading...</span>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th class="sortable">Name</th>
                    <th>Categories</th>
                    <th>Booklet</th>
                    <th class="sortable">Location</th>
                    <th>Events</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5" class="no-results">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" id="pagination"></div>
</div>

<script>
    let allData = [];
    let filteredData = [];
    let currentPage = 1;
    const rowsPerPage = 20;

    const categoryNames = {
        0: 'Materiality',
        1: 'Economy',
        2: 'Governance',
        3: 'Communication',
        4: 'Labour',
        5: 'Ecology'
    };
    const categoryColors = {
        0: '#f5e6ba',
        1: '#acf2c9',
        2: '#fdc5f5',
        3: '#8093f1',
        4: '#72ddf7',
        5: '#00695c'
    };

    async function init() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) {
                throw new Error(`Failed to fetch data.json: ${response.statusText}`);
            }
            const data = await response.json();

            if (!Array.isArray(data.nodes)) {
                throw new Error('Invalid data structure: missing nodes');
            }

            allData = data.nodes;
            filteredData = [...allData];

            populateLocationFilter();
            renderTable();
            setupEventListeners();

        } catch (err) {
            console.error('Initialization failed:', err);
            document.getElementById('tableBody').innerHTML =
                `<tr><td colspan="5" class="no-results"><strong>Error:</strong> ${err.message}</td></tr>`;
        }
    }

    function populateLocationFilter() {
        const locationFilter = document.getElementById('locationFilter');
        const uniqueRegions = Array.from(
            new Set(
                allData
                    .map(person => (person.location || 'Unknown').toString().trim())
                    .filter(region => region.length > 0)
            )
        ).sort((a, b) => a.localeCompare(b));

        uniqueRegions.forEach(region => {
            const option = document.createElement('option');
            option.value = region;
            option.textContent = region;
            locationFilter.appendChild(option);
        });
    }

    function setupEventListeners() {
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('bookletFilter').addEventListener('change', applyFilters);
        document.getElementById('categoryFilter').addEventListener('change', applyFilters);
        document.getElementById('locationFilter').addEventListener('change', applyFilters);
        document.getElementById('resetBtn').addEventListener('click', resetFilters);

        document.querySelectorAll('th.sortable').forEach(header => {
            header.addEventListener('click', function() {
                sortTable(this.textContent.trim());
            });
        });
    }

    function applyFilters() {
        currentPage = 1;
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const bookletFilter = document.getElementById('bookletFilter').value;
        const categoryFilter = document.getElementById('categoryFilter').value;
        const locationFilter = document.getElementById('locationFilter').value;

        filteredData = allData.filter(person => {
            const matchesSearch = person.name.toLowerCase().includes(searchTerm);

            const matchesBooklet = !bookletFilter ||
                (bookletFilter === 'null' ? person.booklet === null :
                 person.booklet && person.booklet.includes(bookletFilter));

            const matchesCategory = !categoryFilter ||
                person.category.toString() === categoryFilter ||
                person.category2.toString() === categoryFilter;

            const personRegion = (person.location || 'Unknown').toString().trim();
            const matchesRegion = !locationFilter || personRegion === locationFilter;

            return matchesSearch && matchesBooklet && matchesCategory && matchesRegion;
        });

        renderTable();
    }

    function sortTable(column) {
        const isName = column === 'Name';
        const isLocation = column === 'Location';

        filteredData.sort((a, b) => {
            const aVal = isName ? a.name : isLocation ? (a.location || 'Unknown') : '';
            const bVal = isName ? b.name : isLocation ? (b.location || 'Unknown') : '';
            return aVal.localeCompare(bVal);
        });

        currentPage = 1;
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageData = filteredData.slice(start, end);

        if (pageData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="no-results">No results found. Try adjusting your filters.</td></tr>';
            document.getElementById('resultCount').textContent = '0 results';
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        tbody.innerHTML = pageData.map(person => `
            <tr>
                <td><strong>${person.name}</strong></td>
                <td>
                    <span class="category-badge" style="background-color: ${categoryColors[person.category]}">
                        ${categoryNames[person.category]}
                    </span>
                    <span class="category-badge" style="background-color: ${categoryColors[person.category2]}">
                        ${categoryNames[person.category2]}
                    </span>
                </td>
                <td>${person.booklet || '—'}</td>
                <td>${person.location || 'Unknown'}</td>
                <td class="events-cell">${person.events && person.events.length > 0 ? person.events.length + ' event(s)' : '—'}</td>
            </tr>
        `).join('');

        document.getElementById('resultCount').textContent =
            `Showing ${start + 1}–${Math.min(end, filteredData.length)} of ${filteredData.length} results`;
        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        const paginationDiv = document.getElementById('pagination');

        if (totalPages <= 1) {
            paginationDiv.innerHTML = '';
            return;
        }

        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
        }
        paginationDiv.innerHTML = html;
    }

    function goToPage(page) {
        currentPage = page;
        renderTable();
    }

    function resetFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('bookletFilter').value = '';
        document.getElementById('categoryFilter').value = '';
        document.getElementById('locationFilter').value = '';
        currentPage = 1;
        filteredData = [...allData];
        renderTable();
    }

    init();
</script>

</body>
</html>
