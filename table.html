<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USRN Participants & Interviewees</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'CustomFont', sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #191919;
            color: #e0e0e0;
        }

        .table-section {
            margin-top: 20px;
            background-color: transparent;
            padding: 16px;
            border-radius: 8px;
            box-shadow: none;
        }

        .controls-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            align-items: flex-end;
        }

        .search-control {
            flex-basis: 100%;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #e0e0e0;
            font-size: 14px;
        }

        .control-group input,
        .control-group select {
            padding: 8px 12px;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 14px;
            font-family: 'CustomFont', sans-serif;
            min-width: 180px;
            background-color: #2a2a2a;
            color: #e0e0e0;
        }

        .control-group input:focus,
        .control-group select:focus {
            outline: none;
            border-color: #1f77b4;
            box-shadow: 0 0 5px rgba(31, 119, 180, 0.5);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            font-family: 'CustomFont', sans-serif;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #resetBtn {
            background-color: #666666;
            color: white;
        }

        #resetBtn:hover {
            background-color: #555555;
        }

        .results-info {
            margin-bottom: 15px;
            color: #aaa;
            font-size: 14px;
        }

        .table-container {
            overflow-x: auto;
            border: 0px solid #ddd;
            border-radius: 0px;
            background-color: transparent;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 10px;
            background-color: transparent;
        }

        thead {
            background-color: #666666;
            color: white;
            position: sticky;
            top: 0;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: bold;
            border-bottom: 2px solid #0d47a1;
            cursor: pointer;
            user-select: none;
        }

        th:hover {
            background-color: #555555;
        }

        th.sortable::after {
            content: " ⇅";
            opacity: 0.5;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #333;
        }

        tbody tr {
            transition: background-color 0.2s;
            background-color: rgba(255, 255, 255, 0.05);
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        tbody tr:nth-child(even) {
            background-color: rgba(255, 255, 255, 0.08);
        }

        .theme-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            color: black;
            font-size: 12px;
            font-weight: bold;
            margin-right: 5px;
            margin-bottom: 3px;
        }

        .participation-cell {
            font-size: 12px;
            color: #aaa;
        }

        .no-results {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 16px;
        }

        .pagination {
            position: sticky;
            bottom: 0;
            z-index: 10;
            background-color: #191919;
            padding: 10px 0;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 5px;
            flex-wrap: wrap;
        }

        .pagination button {
            padding: 6px 10px;
            background-color: #2a2a2a;
            color: #e0e0e0;
            border: 1px solid #444;
        }

        .pagination button.active {
            background-color: #666666;
            color: white;
            border-color: #666666;
        }

        .pagination button:hover {
            background-color: #666666;
            color: white;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #5aabf0;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
            color: #7ec0f5;
        }

        @media (max-width: 600px) {
            body {
                padding: 8px;
            }

            .table-section {
                padding: 10px;
            }

            .controls-container {
                flex-direction: column;
                gap: 10px;
            }

            .control-group input,
            .control-group select {
                min-width: unset;
                width: 100%;
                box-sizing: border-box;
            }

            .button-group {
                width: 100%;
            }

            .button-group button {
                width: 100%;
            }

            /* Card-style rows on mobile */
            table, thead, tbody, th, td, tr {
                display: block;
            }

            thead {
                display: none;
            }

            tbody tr {
                margin-bottom: 12px;
                border: 1px solid #444;
                border-radius: 6px;
                padding: 10px;
                background-color: rgba(255, 255, 255, 0.05);
            }

            tbody tr:nth-child(even) {
                background-color: rgba(255, 255, 255, 0.08);
            }

            td {
                padding: 4px 8px;
                border-bottom: none;
                font-size: 13px;
                display: flex;
                align-items: flex-start;
                gap: 6px;
            }

            td::before {
                content: attr(data-label);
                font-weight: bold;
                color: #666666;
                min-width: 80px;
                flex-shrink: 0;
                font-size: 11px;
                text-transform: uppercase;
                padding-top: 2px;
            }

            .theme-badge {
                font-size: 11px;
                padding: 3px 6px;
            }

            .results-info {
                font-size: 13px;
            }

            .pagination button {
                padding: 8px 12px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="table-section">
    <div class="controls-container">
        <div class="control-group search-control">
            <input type="text" id="searchInput" placeholder="e.g., Sabina Andron">
        </div>

        <div class="control-group">
            <select id="participationFilter">
                <option value="">All Participation</option>
                <option value="__none__">No Participation</option>
            </select>
        </div>

        <div class="control-group">
            <select id="themeFilter">
                <option value="">All Themes</option>
            </select>
        </div>

        <div class="control-group">
            <select id="locationFilter">
                <option value="">All Locations</option>
            </select>
        </div>

        <div class="button-group">
            <button id="resetBtn">Reset Filters</button>
        </div>
    </div>

    <div class="results-info">
        <span id="resultCount">Loading...</span>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th class="sortable">Name</th>
                    <th>Relevant Focus</th>
                    <th>Themes</th>
                    <th class="sortable">Location</th>
                    <th>Geographical Focus</th>
                    <th>Participation</th>
                    <th>Definition</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="7" class="no-results">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" id="pagination"></div>
</div>

<script>
    let allData = [];
    let filteredData = [];
    let currentPage = 1;
    const rowsPerPage = 5;

    // Theme name -> badge colour (themes are listed in data.json under "themes")
    const themeColors = {
        Materiality: '#f5e6ba',
        Economy: '#acf2c9',
        Governance: '#fdc5f5',
        Communication: '#8093f1',
        Labour: '#72ddf7',
        Ecology: '#00695c'
    };
    const DEFAULT_THEME_COLOR = '#888';

    const asArray = value => Array.isArray(value) ? value : [];
    const escapeHtml = value => String(value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));

    async function init() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) {
                throw new Error(`Failed to fetch data.json: ${response.statusText}`);
            }
            const data = await response.json();

            if (!Array.isArray(data.nodes)) {
                throw new Error('Invalid data structure: missing nodes');
            }

            allData = data.nodes;
            filteredData = [...allData];

            populateThemeFilter(asArray(data.themes));
            populateParticipationFilter();
            populateLocationFilter();
            renderTable();
            setupEventListeners();

        } catch (err) {
            console.error('Initialization failed:', err);
            document.getElementById('tableBody').innerHTML =
                `<tr><td colspan="7" class="no-results"><strong>Error:</strong> ${err.message}</td></tr>`;
        }
    }

    function populateThemeFilter(themes) {
        const themeFilter = document.getElementById('themeFilter');
        const names = themes.length > 0
            ? themes.map(t => t.name)
            : Array.from(new Set(allData.flatMap(p => asArray(p.themes)))).sort();
        names.forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            option.textContent = name;
            themeFilter.appendChild(option);
        });
    }

    function populateParticipationFilter() {
        const participationFilter = document.getElementById('participationFilter');
        Array.from(new Set(allData.flatMap(p => asArray(p.participation))))
            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
            .forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                participationFilter.appendChild(option);
            });
    }

    function populateLocationFilter() {
        const locationFilter = document.getElementById('locationFilter');
        const uniqueRegions = Array.from(
            new Set(
                allData
                    .map(person => (person.location || 'Unknown').toString().trim())
                    .filter(region => region.length > 0)
            )
        ).sort((a, b) => a.localeCompare(b));

        uniqueRegions.forEach(region => {
            const option = document.createElement('option');
            option.value = region;
            option.textContent = region;
            locationFilter.appendChild(option);
        });
    }

    function setupEventListeners() {
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('participationFilter').addEventListener('change', applyFilters);
        document.getElementById('themeFilter').addEventListener('change', applyFilters);
        document.getElementById('locationFilter').addEventListener('change', applyFilters);
        document.getElementById('resetBtn').addEventListener('click', resetFilters);

        document.querySelectorAll('th.sortable').forEach(header => {
            header.addEventListener('click', function() {
                sortTable(this.textContent.trim());
            });
        });
    }

    function applyFilters() {
        currentPage = 1;
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const participationFilter = document.getElementById('participationFilter').value;
        const themeFilter = document.getElementById('themeFilter').value;
        const locationFilter = document.getElementById('locationFilter').value;

        filteredData = allData.filter(person => {
            const matchesSearch = person.name.toLowerCase().includes(searchTerm);

            const participation = asArray(person.participation);
            const matchesParticipation = !participationFilter ||
                (participationFilter === '__none__' ? participation.length === 0 :
                 participation.includes(participationFilter));

            const matchesTheme = !themeFilter || asArray(person.themes).includes(themeFilter);

            const personRegion = (person.location || 'Unknown').toString().trim();
            const matchesRegion = !locationFilter || personRegion === locationFilter;

            return matchesSearch && matchesParticipation && matchesTheme && matchesRegion;
        });

        renderTable();
    }

    function sortTable(column) {
        const isName = column === 'Name';
        const isLocation = column === 'Location';

        filteredData.sort((a, b) => {
            const aVal = isName ? a.name : isLocation ? (a.location || 'Unknown') : '';
            const bVal = isName ? b.name : isLocation ? (b.location || 'Unknown') : '';
            return aVal.localeCompare(bVal);
        });

        currentPage = 1;
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageData = filteredData.slice(start, end);

        if (pageData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="no-results">No results found. Try adjusting your filters.</td></tr>';
            document.getElementById('resultCount').textContent = '0 results';
            document.getElementById('pagination').innerHTML = '';
            return;
        }

        tbody.innerHTML = pageData.map(person => `
            <tr>
                <td data-label="Name"><strong>${escapeHtml(person.name)}</strong></td>
                <td data-label="Relevant Focus">${person['relevant focus'] ? escapeHtml(person['relevant focus']) : '—'}</td>
                <td data-label="Themes">
                    ${asArray(person.themes).length > 0 ? asArray(person.themes).map(theme => `<span class="theme-badge" style="background-color: ${themeColors[theme] || DEFAULT_THEME_COLOR}">${escapeHtml(theme)}</span>`).join('') : '—'}
                </td>
                <td data-label="Location">${person.location ? escapeHtml(person.location) : 'Unknown'}</td>
                <td data-label="Geographical Focus">${asArray(person['geographical focus']).length > 0 ? escapeHtml(asArray(person['geographical focus']).join(', ')) : '—'}</td>
                <td data-label="Participation" class="participation-cell">${asArray(person.participation).length > 0 ? escapeHtml(asArray(person.participation).join(', ')) : '—'}</td>
                <td data-label="Definition">${person.definition ? escapeHtml(person.definition) : '—'}</td>
            </tr>
        `).join('');

        document.getElementById('resultCount').textContent =
            `Showing ${start + 1}–${Math.min(end, filteredData.length)} of ${filteredData.length} results`;
        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        const paginationDiv = document.getElementById('pagination');

        if (totalPages <= 1) {
            paginationDiv.innerHTML = '';
            return;
        }

        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
        }
        paginationDiv.innerHTML = html;
    }

    function goToPage(page) {
        currentPage = page;
        renderTable();
    }

    function resetFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('participationFilter').value = '';
        document.getElementById('themeFilter').value = '';
        document.getElementById('locationFilter').value = '';
        currentPage = 1;
        filteredData = [...allData];
        renderTable();
    }

    init();
</script>

</body>
</html>
