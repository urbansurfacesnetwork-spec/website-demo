<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USRN Map Preview</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            color-scheme: dark;
            --bg: #191919;
            --text: #e0e0e0;
            --accent: #72ddf7;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'CustomFont', sans-serif;
        }

        .tabs {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            box-sizing: border-box;
            background: var(--bg);
            z-index: 1000;
        }

        .tab {
            font-family: inherit;
            font-size: 15px;
            color: var(--text);
            background: #202020;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 0 16px;
            cursor: pointer;
        }

        .tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .leaflet-container, .leaflet-tooltip, .leaflet-popup-content {
            font-family: 'CustomFont', sans-serif;
        }

        #map {
            position: absolute;
            top: 48px;
            bottom: 0;
            left: 0;
            right: 0;
            filter: grayscale(100%);
        }

        .marker-cluster-purple { background: rgba(164, 46, 255, 0.35); }
        .marker-cluster-purple div { background: rgba(164, 46, 255, 0.85); color: #fff; }
        .marker-cluster-white { background: rgba(255, 255, 255, 0.35); }
        .marker-cluster-white div { background: rgba(255, 255, 255, 0.9); color: #000; }
        .marker-cluster div { font-family: 'CustomFont', sans-serif; }

            filter: grayscale(100%);
        }

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: #202020;
            color: var(--text);
        }

        .leaflet-container a {
            color: var(--accent);
        }

    </style>
</head>
<body>
    <div class="tabs" role="tablist">
        <button class="tab active" role="tab" data-mode="based">Where are USRN members based?</button>
        <button class="tab" role="tab" data-mode="research">Which countries are USRN members researching?</button>
    </div>
    <div id="map" aria-label="World map showing city markers"></div>

    <script>
        const map = L.map('map', {
            center: [24, 10],
            zoom: 2,
            minZoom: 2,
            attributionControl: false,
            zoomControl: true,
            preferCanvas: true,
            worldCopyJump: true
        });

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        const cityCoordinates = {

        const extraPlaces = {

            Norway: [60.472, 8.4689],

            'South Africa': [-30.5595, 22.9375],

            Taiwan: [23.6978, 120.9605],
            'Timor Leste': [-8.8742, 125.7275],
            'Türkiye': [38.9637, 35.2433],
            Uganda: [1.3733, 32.2903],
            Americas: [15, -80],
            Europe: [50, 10],
            'Balkan states': [43.0, 21.0],
            'Basque Country': [43.0, -2.5]
        };

        const multiLocations = {
            'Bengaluru, India; Australia': ['Bengaluru', 'Australia'],
            'Bogota; Reno, Colombia; USA': ['Bogota', 'Reno'],
            'Bucharest; London, Romania; UK': ['Bucharest', 'London'],
            'Cambridge, MA, USA; Netherlands': ['Cambridge, MA', 'Netherlands'],
            'Edinburgh, UK; USA': ['Edinburgh', 'USA'],
            'Jerusalem, Israel; Portugal': ['Jerusalem', 'Portugal'],
            'London, UK; Italy': ['London', 'Italy'],
            'London; Stockholm, UK; Sweden': ['London', 'Stockholm'],
            'Madrid, Spain; Ghana': ['Madrid', 'Ghana'],
            'Oxford, UK; Ireland': ['Oxford', 'Ireland']
        };

        const PURPLE = '#A42EFF';
        const WHITE = '#ffffff';

        let clusterLayer = null;
        let allPeople = [];

        function lookup(name) {
            return cityCoordinates[name] || extraPlaces[name] || null;
        }

        function placesFor(location) {
            if (!location) return [];
            const names = multiLocations[location] || [String(location).split(/[;,]/)[0].trim()];
            return names
                .map(name => ({ name, coordinates: lookup(name) }))
                .filter(place => place.coordinates);
        }

        function focusPlaces(node) {
            return (node['geographical focus'] || [])
                .map(name => ({ name, coordinates: lookup(name) }))
                .filter(place => place.coordinates);
        }

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function makeTooltip(person) {
            const themes = (person.themes || []).join(', ');
            const locations = person.locations.map(p => p.name).join(', ');
            return `<strong>${escapeHtml(person.name)}</strong>` +
                `<br>Focus: ${escapeHtml(person['relevant focus'] || '—')}` +
                `<br>Themes: ${escapeHtml(themes || '—')}` +
                `<br>Locations: ${escapeHtml(locations || '—')}`;
        }

        function makeCluster(colorClass) {
            return L.markerClusterGroup({
                showCoverageOnHover: false,
                spiderfyOnMaxZoom: true,
                maxClusterRadius: 40,
                iconCreateFunction: cluster => L.divIcon({
                    html: `<div><span>${cluster.getChildCount()}</span></div>`,
                    className: `marker-cluster marker-cluster-${colorClass}`,
                    iconSize: L.point(40, 40)
                })
            });
        }

        function draw(mode) {
            if (clusterLayer) map.removeLayer(clusterLayer);
            const based = mode === 'based';
            const fill = based ? PURPLE : WHITE;
            clusterLayer = makeCluster(based ? 'purple' : 'white');
            const tooltipOptions = { direction: 'top', opacity: 1 };
            const bounds = [];

            allPeople.forEach(person => {
                const html = makeTooltip(person);
                const places = based ? person.locations : person.focuses;
                places.forEach(place => {
                    L.circleMarker(place.coordinates, {
                        radius: 6,
                        color: '#000000',
                        weight: 1,
                        fillColor: fill,
                        fillOpacity: 1
                    }).bindTooltip(html, tooltipOptions).addTo(clusterLayer);
                    bounds.push(place.coordinates);
                });
            });

            map.addLayer(clusterLayer);
            if (bounds.length) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === tab));
                draw(tab.dataset.mode);
            });
        });

        async function loadPeople() {
            let nodes = [];

            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error(`Failed to fetch data.json: ${response.statusText}`);
                const data = await response.json();
                nodes = Array.isArray(data.nodes) ? data.nodes : [];
            } catch (error) {
                console.error(error);
            }

            allPeople = nodes
                .map(node => ({ ...node, locations: placesFor(node.location), focuses: focusPlaces(node) }))
                .filter(node => node.locations.length || node.focuses.length);

            draw('based');
        }

        const attributionControl = L.control.attribution({ prefix: false }).addTo(map);
        attributionControl.addAttribution('&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors');

        loadPeople();
    </script>
</body>
</html>
