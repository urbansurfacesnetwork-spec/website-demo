<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USRN Map Preview</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            color-scheme: dark;
            --bg: #191919;
            --text: #e0e0e0;
            --accent: #72ddf7;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'CustomFont', sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
            filter: grayscale(100%);
        }

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: #202020;
            color: var(--text);
        }

        .leaflet-container a {
            color: var(--accent);
        }

        .square-node {
            width: 12px;
            height: 12px;
            margin-left: -6px;
            margin-top: -6px;
            border: 1.5px solid #000000;
            background: #000000;
            opacity: 0.9;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="map" aria-label="World map showing city markers"></div>

    <script>
        const map = L.map('map', {
            center: [24, 10],
            zoom: 2,
            minZoom: 2,
            attributionControl: false,
            zoomControl: true,
            preferCanvas: true,
            worldCopyJump: true
        });

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        const cityCoordinates = {
            Melbourne: [-37.8136, 144.9631],
            Manchester: [53.4808, -2.2426],
            Vienna: [48.2082, 16.3738],
            London: [51.5072, -0.1276],
            'New York': [40.7128, -74.0060],
            'São Paulo': [-23.5505, -46.6333],
            Tokyo: [35.6762, 139.6503]
        };

        const placeholderPeople = [
            { name: 'Placeholder — London', location: 'London', coordinates: [51.5072, -0.1276], placeholder: true },
            { name: 'Placeholder — New York', location: 'New York', coordinates: [40.7128, -74.0060], placeholder: true },
            { name: 'Placeholder — São Paulo', location: 'São Paulo', coordinates: [-23.5505, -46.6333], placeholder: true },
            { name: 'Placeholder — Tokyo', location: 'Tokyo', coordinates: [35.6762, 139.6503], placeholder: true },
            { name: 'Placeholder — Paris', location: 'Paris', coordinates: [48.8566, 2.3522], placeholder: true },
            { name: 'Placeholder — Berlin', location: 'Berlin', coordinates: [52.5200, 13.4050], placeholder: true },
            { name: 'Placeholder — Sydney', location: 'Sydney', coordinates: [-33.8688, 151.2093], placeholder: true },
            { name: 'Placeholder — Los Angeles', location: 'Los Angeles', coordinates: [34.0522, -118.2437], placeholder: true },
            { name: 'Placeholder — Chicago', location: 'Chicago', coordinates: [41.8781, -87.6298], placeholder: true },
            { name: 'Placeholder — Toronto', location: 'Toronto', coordinates: [43.6532, -79.3832], placeholder: true },
            { name: 'Placeholder — Amsterdam', location: 'Amsterdam', coordinates: [52.3676, 4.9041], placeholder: true },
            { name: 'Placeholder — Barcelona', location: 'Barcelona', coordinates: [41.3851, 2.1734], placeholder: true },
            { name: 'Placeholder — Seoul', location: 'Seoul', coordinates: [37.5665, 126.9780], placeholder: true },
            { name: 'Placeholder — Singapore', location: 'Singapore', coordinates: [1.3521, 103.8198], placeholder: true },
            { name: 'Placeholder — Dubai', location: 'Dubai', coordinates: [25.2048, 55.2708], placeholder: true },
            { name: 'Placeholder — Mumbai', location: 'Mumbai', coordinates: [19.0760, 72.8777], placeholder: true },
            { name: 'Placeholder — Cairo', location: 'Cairo', coordinates: [30.0444, 31.2357], placeholder: true },
            { name: 'Placeholder — Nairobi', location: 'Nairobi', coordinates: [-1.2921, 36.8219], placeholder: true },
            { name: 'Placeholder — Lagos', location: 'Lagos', coordinates: [6.5244, 3.3792], placeholder: true },
            { name: 'Placeholder — Johannesburg', location: 'Johannesburg', coordinates: [-26.2041, 28.0473], placeholder: true },
            { name: 'Placeholder — Cape Town', location: 'Cape Town', coordinates: [-33.9249, 18.4241], placeholder: true },
            { name: 'Placeholder — Buenos Aires', location: 'Buenos Aires', coordinates: [-34.6037, -58.3816], placeholder: true },
            { name: 'Placeholder — Mexico City', location: 'Mexico City', coordinates: [19.4326, -99.1332], placeholder: true },
            { name: 'Placeholder — Bogotá', location: 'Bogotá', coordinates: [4.7110, -74.0721], placeholder: true },
            { name: 'Placeholder — Lima', location: 'Lima', coordinates: [-12.0464, -77.0428], placeholder: true },
            { name: 'Placeholder — Santiago', location: 'Santiago', coordinates: [-33.4489, -70.6693], placeholder: true },
            { name: 'Placeholder — Istanbul', location: 'Istanbul', coordinates: [41.0082, 28.9784], placeholder: true },
            { name: 'Placeholder — Moscow', location: 'Moscow', coordinates: [55.7558, 37.6173], placeholder: true },
            { name: 'Placeholder — Warsaw', location: 'Warsaw', coordinates: [52.2297, 21.0122], placeholder: true },
            { name: 'Placeholder — Stockholm', location: 'Stockholm', coordinates: [59.3293, 18.0686], placeholder: true },
            { name: 'Placeholder — Oslo', location: 'Oslo', coordinates: [59.9139, 10.7522], placeholder: true },
            { name: 'Placeholder — Helsinki', location: 'Helsinki', coordinates: [60.1699, 24.9384], placeholder: true },
            { name: 'Placeholder — Copenhagen', location: 'Copenhagen', coordinates: [55.6761, 12.5683], placeholder: true },
            { name: 'Placeholder — Lisbon', location: 'Lisbon', coordinates: [38.7169, -9.1399], placeholder: true },
            { name: 'Placeholder — Athens', location: 'Athens', coordinates: [37.9838, 23.7275], placeholder: true },
            { name: 'Placeholder — Rome', location: 'Rome', coordinates: [41.9028, 12.4964], placeholder: true },
            { name: 'Placeholder — Milan', location: 'Milan', coordinates: [45.4642, 9.1900], placeholder: true },
            { name: 'Placeholder — Brussels', location: 'Brussels', coordinates: [50.8503, 4.3517], placeholder: true },
            { name: 'Placeholder — Zurich', location: 'Zurich', coordinates: [47.3769, 8.5417], placeholder: true },
            { name: 'Placeholder — Prague', location: 'Prague', coordinates: [50.0755, 14.4378], placeholder: true },
            { name: 'Placeholder — Budapest', location: 'Budapest', coordinates: [47.4979, 19.0402], placeholder: true },
            { name: 'Placeholder — Bucharest', location: 'Bucharest', coordinates: [44.4268, 26.1025], placeholder: true },
            { name: 'Placeholder — Kyiv', location: 'Kyiv', coordinates: [50.4501, 30.5234], placeholder: true },
            { name: 'Placeholder — Beijing', location: 'Beijing', coordinates: [39.9042, 116.4074], placeholder: true },
            { name: 'Placeholder — Shanghai', location: 'Shanghai', coordinates: [31.2304, 121.4737], placeholder: true },
            { name: 'Placeholder — Hong Kong', location: 'Hong Kong', coordinates: [22.3193, 114.1694], placeholder: true },
            { name: 'Placeholder — Jakarta', location: 'Jakarta', coordinates: [-6.2088, 106.8456], placeholder: true },
            { name: 'Placeholder — Bangkok', location: 'Bangkok', coordinates: [13.7563, 100.5018], placeholder: true },
            { name: 'Placeholder — Kuala Lumpur', location: 'Kuala Lumpur', coordinates: [3.1390, 101.6869], placeholder: true },
            { name: 'Placeholder — Manila', location: 'Manila', coordinates: [14.5995, 120.9842], placeholder: true },
            { name: 'Placeholder — Karachi', location: 'Karachi', coordinates: [24.8607, 67.0011], placeholder: true },
            { name: 'Placeholder — Dhaka', location: 'Dhaka', coordinates: [23.8103, 90.4125], placeholder: true },
            { name: 'Placeholder — Tehran', location: 'Tehran', coordinates: [35.6892, 51.3890], placeholder: true },
            { name: 'Placeholder — Riyadh', location: 'Riyadh', coordinates: [24.7136, 46.6753], placeholder: true },
        ];

        const edgeLayer = L.layerGroup().addTo(map);
        const markerLayer = L.layerGroup().addTo(map);

        function makePopup(person) {
            return `<strong>${person.name}</strong><br>${person.location || 'Unknown location'}`;
        }

        function drawMarkers(people) {
            edgeLayer.clearLayers();
            markerLayer.clearLayers();
            const bounds = [];

            for (let i = 0; i < people.length; i += 1) {
                for (let j = i + 1; j < people.length; j += 1) {
                    L.polyline([people[i].coordinates, people[j].coordinates], {
                        color: '#000000',
                        weight: 1,
                        opacity: 0.25
                    }).addTo(edgeLayer);
                }
            }

            people.forEach(person => {
                const marker = L.marker(person.coordinates, {
                    icon: L.divIcon({
                        className: 'square-node',
                        iconSize: [12, 12]
                    })
                }).bindPopup(makePopup(person));

                marker.addTo(markerLayer);
                bounds.push(person.coordinates);
            });

            if (bounds.length) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        async function loadPeople() {
            let nodes = [];

            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error(`Failed to fetch data.json: ${response.statusText}`);
                const data = await response.json();
                nodes = Array.isArray(data.nodes) ? data.nodes : [];
            } catch (error) {
                console.error(error);
            }

            const mappedPeople = nodes
                .map(node => ({ ...node, coordinates: cityCoordinates[node.location] || null, placeholder: false }))
                .filter(node => Array.isArray(node.coordinates));

            const combined = [...mappedPeople, ...placeholderPeople];
            drawMarkers(combined);
        }

        const attributionControl = L.control.attribution({ prefix: false }).addTo(map);
        attributionControl.addAttribution('&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors');

        loadPeople();
    </script>
</body>
</html>
