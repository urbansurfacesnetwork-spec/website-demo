    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            color-scheme: dark;
            --bg: #191919;
            --text: #e0e0e0;
            --accent: #72ddf7;
        }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'CustomFont', sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
            filter: grayscale(100%);
        }

        .leaflet-popup-content-wrapper,
        .leaflet-popup-tip {
            background: #202020;
            color: var(--text);
        }

        .leaflet-container a {
            color: var(--accent);
        }

        .square-node {
            width: 12px;
            height: 12px;
            margin-left: -6px;
            margin-top: -6px;
            border: 1.5px solid #000000;
            background: #000000;
            opacity: 0.9;
            box-sizing: border-box;
        }
    </style>
</head>

        const edgeLayer = L.layerGroup().addTo(map);
        const markerLayer = L.layerGroup().addTo(map);

        function cityOf(location) {
            if (!location) return null;
            return String(location).split(/[;,]/)[0].trim() || null;
        }

        function makePopup(person) {
            return `<strong>${person.name}</strong><br>${person.location || 'Unknown location'}`;
        }

        function drawMarkers(people) {
            edgeLayer.clearLayers();
            markerLayer.clearLayers();
            const bounds = [];

            for (let i = 0; i < people.length; i += 1) {
                for (let j = i + 1; j < people.length; j += 1) {
                    L.polyline([people[i].coordinates, people[j].coordinates], {
                        color: '#000000',
                        weight: 1,
                        opacity: 0.25
                    }).addTo(edgeLayer);
                }
            }

            people.forEach(person => {
                const marker = L.marker(person.coordinates, {
                    icon: L.divIcon({
                        className: 'square-node',
                        iconSize: [12, 12]
                    })
                }).bindPopup(makePopup(person));

                marker.addTo(markerLayer);
                bounds.push(person.coordinates);
            });

            if (bounds.length) {
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }

        async function loadPeople() {
            let nodes = [];

            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error(`Failed to fetch data.json: ${response.statusText}`);
                const data = await response.json();
                nodes = Array.isArray(data.nodes) ? data.nodes : [];
            } catch (error) {
                console.error(error);
            }

            const mappedPeople = nodes
                .map(node => ({ ...node, coordinates: cityCoordinates[cityOf(node.location)] || null, placeholder: false }))
                .filter(node => Array.isArray(node.coordinates));

            const combined = [...mappedPeople, ...placeholderPeople];
            drawMarkers(combined);
        }

        const attributionControl = L.control.attribution({ prefix: false }).addTo(map);
        attributionControl.addAttribution('&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors');
