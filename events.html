<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Events Network USRN</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'CustomFont', sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #191919;
            color: #e0e0e0;
        }

        #main {
            width: 100%;
            height: 100vh;
            background-color: transparent;
        }

        .error {
            color: #ff6b6b;
            padding: 0px;
            background-color: transparent;
            border-radius: 0px;
            margin-bottom: 15px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>

<div id="main"></div>

<script>
    const EVENT_COLOR = '#fdc5f5';
    const PERSON_COLOR = '#acf2c9';

    async function init() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error(`Failed to fetch data.json: ${response.statusText}`);
            const data = await response.json();
            if (!Array.isArray(data.nodes)) throw new Error('Invalid data structure: missing nodes');

            // Build event → participants map
            const eventPeopleMap = {};
            data.nodes.forEach(node => {
                (node.events || []).forEach(ev => {
                    if (!eventPeopleMap[ev]) eventPeopleMap[ev] = [];
                    eventPeopleMap[ev].push(node.name);
                });
            });

            const eventNames = Object.keys(eventPeopleMap).sort();
            const numEvents = eventNames.length;
            const cx = 0, cy = 0, radius = 350;

            // Event nodes — fixed around a circle
            const eventNodes = eventNames.map((name, i) => {
                const angle = (2 * Math.PI * i) / numEvents - Math.PI / 2;
                return {
                    id: `event::${name}`,
                    name,
                    isEvent: true,
                    x: cx + radius * Math.cos(angle),
                    y: cy + radius * Math.sin(angle),
                    fixed: true,
                    symbol: 'circle',
                    symbolSize: 22,
                    itemStyle: { color: EVENT_COLOR, borderColor: '#fff', borderWidth: 2 },
                    label: {
                        show: true,
                        position: 'outside',
                        fontSize: 11,
                        fontFamily: 'CustomFont, sans-serif',
                        color: '#e0e0e0'
                    }
                };
            });

            // Person nodes — free-floating, placed by force layout
            const involvedPeople = new Set(Object.values(eventPeopleMap).flat());
            const personNodes = data.nodes
                .filter(node => involvedPeople.has(node.name))
                .map(node => ({
                    id: `person::${node.name}`,
                    name: node.name,
                    isPerson: true,
                    personData: node,
                    symbol: 'rect',
                    symbolSize: 12,
                    itemStyle: { color: PERSON_COLOR, borderColor: '#888', borderWidth: 1 },
                    label: {
                        show: true,
                        position: 'right',
                        fontSize: 11,
                        fontFamily: 'CustomFont, sans-serif',
                        color: '#e0e0e0'
                    }
                }));

            // Edges: event → person
            const links = eventNames.flatMap(ev =>
                eventPeopleMap[ev].map(person => ({
                    source: `event::${ev}`,
                    target: `person::${person}`,
                    lineStyle: { color: EVENT_COLOR, width: 2, opacity: 0.6 }
                }))
            );

            const chartDom = document.getElementById('main');
            const myChart = echarts.init(chartDom);

            function getCenter() {
                return [chartDom.clientWidth / 2 - 400, chartDom.clientHeight / 2 - 400];
            }

            myChart.setOption({
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'item',
                    formatter: function (params) {
                        if (params.dataType !== 'node') return '';
                        if (params.data.isEvent) {
                            const people = eventPeopleMap[params.data.name] || [];
                            return `<b>${params.data.name}</b><br/>Participants (${people.length}):<br/>${people.join('<br/>')}`;
                        }
                        if (params.data.isPerson) {
                            const n = params.data.personData;
                            const evList = (n.events || []).join('<br/>') || 'None';
                            return `<b>${n.name}</b><br/>Location: ${n.location || 'Unknown'}<br/>Events:<br/>${evList}`;
                        }
                        return '';
                    }
                },
                series: [{
                    type: 'graph',
                    layout: 'force',
                    center: getCenter(),
                    roam: false,
                    force: { repulsion: 120, edgeLength: [40, 160], gravity: 0.05 },
                    data: [...eventNodes, ...personNodes],
                    links,
                    lineStyle: { curveness: 0.1, opacity: 0.7 },
                    emphasis: { focus: 'adjacency', lineStyle: { width: 3 } }
                }]
            });

            new ResizeObserver(() => {
                myChart.resize();
                myChart.setOption({ series: [{ center: getCenter() }] });
            }).observe(chartDom);
        } catch (err) {
            console.error('Initialization failed:', err);
            const mainDiv = document.getElementById('main');
            mainDiv.innerHTML = `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
            mainDiv.style.height = 'auto';
        }
    }

    init();
</script>

</body>
</html>
