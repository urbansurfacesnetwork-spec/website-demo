<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Network Connections USRN</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'CustomFont', sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #191919;
            color: #e0e0e0;
        }
        
        #main {
            width: 100%;
            height: 800px;
            border-radius: 0px;
            box-shadow: 0 0px 0px rgba(0, 0, 0, 0.0);
            background-color: transparent;
            margin-bottom: 0px;
        }
        
        .error {
            color: #ff6b6b;
            padding: 0px;
            background-color: transparent;
            border-radius: 0px;
            margin-bottom: 15px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>

<div id="main"></div>

<script>
    let myChart = null;
    const categoryColors = {
        0: '#f5e6ba',
        1: '#acf2c9',
        2: '#fdc5f5',
        3: '#8093f1',
        4: '#72ddf7',
        5: '#00695c'
    };
    const DEFAULT_EDGE_COLOR = '#9aa0a6';

    // ===== Initialize =====
    async function init() {
        try {
            // Fetch data
            const response = await fetch('data.json');
            if (!response.ok) {
                throw new Error(`Failed to fetch data.json: ${response.statusText}`);
            }
            const data = await response.json();

            if (!Array.isArray(data.categories) || !Array.isArray(data.nodes) || !Array.isArray(data.links)) {
                throw new Error('Invalid data structure: missing categories, nodes, or links');
            }

            // Initialize chart
            initChart(data);

        } catch (err) {
            console.error('Initialization failed:', err);
            const mainDiv = document.getElementById('main');
            mainDiv.innerHTML = `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
            mainDiv.style.height = 'auto';
        }
    }

    // ===== Initialize ECharts =====
    function initChart(data) {
        // Process categories
        const categories = data.categories.map((category, index) => ({
            name: category.name,
            itemStyle: { color: categoryColors[index] }
        }));

        // Process nodes
        const nodes = data.nodes.map(node => {
            const color1 = categoryColors[node.category];
            const color2 = categoryColors[node.category2];

            return {
                name: node.name,
                category: node.category,
                category2: node.category2,
                symbol: 'rect',
                symbolSize: 15,
                value: 15,
                location: node.location,
                booklet: node.booklet,
                definition: node.definition,
                events: node.events,
                color1: color1,
                color2: color2,
                itemStyle: {
                    color: color1,
                    borderColor: color2,
                    borderWidth: 2
                }
            };
        });

        // Add category hub nodes
        const categoryHubNodes = data.categories.map((category, index) => ({
            name: `Category: ${category.name}`,
            category: index,
            category2: index,
            symbol: 'circle',
            symbolSize: 36,
            value: 36,
            isCategoryHub: true,
            itemStyle: {
                color: categoryColors[index],
                borderColor: '#fff',
                borderWidth: 0
            },
            label: {
                show: true,
                fontWeight: 'bold'
            }
        }));

        const graphNodes = [...nodes, ...categoryHubNodes];

        // Create node map
        const nodeMap = {};
        graphNodes.forEach(node => {
            nodeMap[node.name] = node;
        });

        // Filter links
        const links = data.links.filter(link => {
            const sourceNode = nodeMap[link.source];
            const targetNode = nodeMap[link.target];
            
            if (!sourceNode || !targetNode) return false;

            return true;
        }).map(link => {
            const sourceNode = nodeMap[link.source];
            return {
                source: link.source,
                target: link.target,
                lineStyle: {
                    color: sourceNode.color1 || DEFAULT_EDGE_COLOR,
                    width: 1.5
                }
            };
        });

        // Add person-to-category links
        const categoryLinks = nodes.flatMap(node => {
            const links = [{
                source: node.name,
                target: `Category: ${categories[node.category].name}`,
                lineStyle: {
                    color: categoryColors[node.category],
                    width: 1.5
                }
            }];

            if (node.category2 !== node.category) {
                links.push({
                    source: node.name,
                    target: `Category: ${categories[node.category2].name}`,
                    lineStyle: {
                        color: categoryColors[node.category2],
                        width: 1.5
                    }
                });
            }

            return links;
        });

        const allLinks = [...links, ...categoryLinks];

        // Initialize chart
        const chartDom = document.getElementById('main');
        myChart = echarts.init(chartDom);

        const option = {
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'item',
                extraCssText: 'max-width: 300px; white-space: normal; word-wrap: break-word;',
                formatter: function (params) {
                    if (params.dataType === 'node') {
                        if (params.data.isCategoryHub) {
                            return `<b>${params.data.name.replace('Category: ', '')}</b><br/>Category hub`;
                        }
                        const categoryName1 = categories[params.data.category]?.name || 'Unknown';
                        const categoryName2 = categories[params.data.category2]?.name || 'Unknown';
                        const location = params.data.location || 'Unknown';
                        const booklet = params.data.booklet || 'N/A';
                        const eventsText = params.data.events && params.data.events.length > 0 
                            ? params.data.events.join(', ') 
                            : 'None';
                        
                        let tooltip = `<b>${params.data.name}</b><br/>`;
                        tooltip += `Categories: ${categoryName1} & ${categoryName2}<br/>`;
                        tooltip += `Location: ${location}<br/>`;
                        tooltip += `Booklet: ${booklet}<br/>`;
                        tooltip += `Events: ${eventsText}`;
                        
                        return tooltip;
                    } else if (params.dataType === 'edge') {
                        return `Link: ${params.data.source} → ${params.data.target}`;
                    }
                    return '';
                }
            },
            legend: [{
                data: categories.map(c => c.name),
                textStyle: { color: '#e0e0e0', fontFamily: 'CustomFont, sans-serif' }
            }],
            series: [{
                type: 'graph',
                layout: 'force',
                roam: true,
                label: {
                    show: true,
                    position: 'right',
                    fontSize: 10,
                    fontFamily: 'CustomFont, sans-serif',
                    color: '#e0e0e0'
                },
                force: {
                    repulsion: 100,
                    edgeLength: [50, 150]
                },
                data: graphNodes,
                links: allLinks,
                categories: categories,
                lineStyle: {
                    curveness: 0,
                    opacity: 0.85
                }
            }]
        };

        myChart.setOption(option);

        window.addEventListener('resize', () => {
            if (myChart) myChart.resize();
        });
    }

    // ===== Start =====
    init();
</script>

</body>
</html>
