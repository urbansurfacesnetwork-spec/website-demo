<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Network Connections USRN</title>
    <style>
        @font-face {
            font-family: 'CustomFont';
            src: url('fractul.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'CustomFont', sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #191919;
            color: #e0e0e0;
        }
        
        #main {
            width: 100%;
            height: 700px;
            border-radius: 0px;
            box-shadow: 0 0px 0px rgba(0, 0, 0, 0.0);
            background-color: transparent;
            margin-bottom: 0px;
        }
        
        .error {
            color: #ff6b6b;
            padding: 0px;
            background-color: transparent;
            border-radius: 0px;
            margin-bottom: 15px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body>

<div id="main"></div>

<script>
    let myChart = null;
    const themeColors = {
        0: '#f5e6ba',
        1: '#acf2c9',
        2: '#fdc5f5',
        3: '#8093f1',
        4: '#72ddf7',
        5: '#00695c'
    };
    const DEFAULT_EDGE_COLOR = '#9aa0a6';

    // ===== Initialize =====
    async function init() {
        try {
            // Fetch data
            const response = await fetch('data.json');
            if (!response.ok) {
                throw new Error(`Failed to fetch data.json: ${response.statusText}`);
            }
            const data = await response.json();

            if (!Array.isArray(data.themes) || !Array.isArray(data.nodes)) {
                throw new Error('Invalid data structure: missing themes or nodes');
            }

            // Initialize chart
            initChart(data);

        } catch (err) {
            console.error('Initialization failed:', err);
            const mainDiv = document.getElementById('main');
            mainDiv.innerHTML = `<div class="error"><strong>Error:</strong> ${err.message}</div>`;
            mainDiv.style.height = 'auto';
        }
    }

    // ===== Initialize ECharts =====
    function initChart(data) {
        // Process themes (ECharts calls these "categories" internally)
        const themes = data.themes.map((theme, index) => ({
            name: theme.name,
            itemStyle: { color: themeColors[index] }
        }));
        const themeIndex = {};
        data.themes.forEach((theme, index) => { themeIndex[theme.name] = index; });

        // Process nodes
        const hiddenNodePrefixes = ['USF', 'RGS', 'SAH'];
        const nodes = data.nodes
            .filter(node => !hiddenNodePrefixes.some(prefix => node.name.startsWith(prefix)))
            .map(node => {
                const nodeThemes = Array.isArray(node.themes) ? node.themes : [];
                const theme1 = themeIndex[nodeThemes[0]];
                const theme2 = nodeThemes.length > 1 ? themeIndex[nodeThemes[1]] : theme1;
                const color1 = themeColors[theme1] || DEFAULT_EDGE_COLOR;
                const color2 = themeColors[theme2] || color1;

                return {
                    name: node.name,
                    category: theme1,
                    category2: theme2,
                    symbol: 'rect',
                    symbolSize: 15,
                    value: 15,
                    relevantFocus: node['relevant focus'],
                    nodeThemes: nodeThemes,
                    location: node.location,
                    geographicalFocus: node['geographical focus'],
                    participation: node.participation,
                    definition: node.definition,
                    color1: color1,
                    color2: color2,
                    itemStyle: {
                        color: color1,
                        borderColor: color2,
                        borderWidth: 2
                    }
                };
            });

        // Add theme hub nodes
        const themeHubNodes = data.themes.map((theme, index) => ({
            name: `Theme: ${theme.name}`,
            category: index,
            category2: index,
            symbol: 'circle',
            symbolSize: 36,
            value: 36,
            isThemeHub: true,
            itemStyle: {
                color: themeColors[index],
                borderColor: '#fff',
                borderWidth: 0
            },
            label: {
                show: true,
                fontWeight: 'bold'
            }
        }));

        const graphNodes = [...nodes, ...themeHubNodes];

        // Create node map
        const nodeMap = {};
        graphNodes.forEach(node => {
            nodeMap[node.name] = node;
        });

        // Filter links
        const links = (data.links || []).filter(link => {
            const sourceNode = nodeMap[link.source];
            const targetNode = nodeMap[link.target];
            
            if (!sourceNode || !targetNode) return false;

            return true;
        }).map(link => {
            const sourceNode = nodeMap[link.source];
            return {
                source: link.source,
                target: link.target,
                lineStyle: {
                    color: sourceNode.color1 || DEFAULT_EDGE_COLOR,
                    width: 1.5
                }
            };
        });

        // Add person-to-theme links
        const themeLinks = nodes.flatMap(node => node.nodeThemes
            .filter(themeName => themeIndex[themeName] !== undefined)
            .map(themeName => ({
                source: node.name,
                target: `Theme: ${themeName}`,
                lineStyle: {
                    color: themeColors[themeIndex[themeName]],
                    width: 1.5
                }
            })));

        const allLinks = [...links, ...themeLinks];

        // Initialize chart
        const chartDom = document.getElementById('main');
        myChart = echarts.init(chartDom);

        const option = {
            backgroundColor: 'transparent',
            tooltip: {
                trigger: 'item',
                extraCssText: 'white-space: nowrap;',
                position: function (point, params, dom, rect, size) {
                    const size0 = params && params.data && params.data.symbolSize;
                    const r = (Array.isArray(size0) ? size0[0] : size0 || 20) / 2;
                    const x = Math.max(0, Math.min(point[0] - size.contentSize[0] / 2, size.viewSize[0] - size.contentSize[0]));
                    let y = point[1] + r + 12;
                    if (y + size.contentSize[1] > size.viewSize[1]) y = Math.max(0, point[1] - r - 12 - size.contentSize[1]);
                    return [x, y];
                },
                textStyle: { fontFamily: 'CustomFont, sans-serif' },
                formatter: function (params) {
                    if (params.dataType === 'node') {
                        if (params.data.isThemeHub) {
                            return `<b>${params.data.name.replace('Theme: ', '')}</b><br/>Theme hub`;
                        }
                        const themesText = params.data.nodeThemes.length > 0
                            ? params.data.nodeThemes.join(' & ')
                            : 'None';
                        const location = params.data.location || 'Unknown';
                        const relevantFocus = params.data.relevantFocus || 'N/A';
                        const geoFocus = params.data.geographicalFocus && params.data.geographicalFocus.length > 0
                            ? params.data.geographicalFocus.join(', ')
                            : 'N/A';
                        const participationText = params.data.participation && params.data.participation.length > 0
                            ? params.data.participation.join(', ')
                            : 'None';

                        const wrap = (text, max = 35) => {
                            const lines = [];
                            let line = '';
                            String(text).split(/\s+/).forEach(word => {
                                while (word.length > max) {
                                    if (line) { lines.push(line); line = ''; }
                                    lines.push(word.slice(0, max));
                                    word = word.slice(max);
                                }
                                if (!line) line = word;
                                else if ((line + ' ' + word).length <= max) line += ' ' + word;
                                else { lines.push(line); line = word; }
                            });
                            if (line) lines.push(line);
                            return lines.join('<br/>');
                        };

                        let tooltip = `<b>${wrap(params.data.name)}</b><br/>`;
                        tooltip += `${wrap('Relevant focus: ' + relevantFocus)}<br/>`;
                        tooltip += `${wrap('Themes: ' + themesText)}<br/>`;
                        tooltip += `${wrap('Location: ' + location)}<br/>`;
                        tooltip += `${wrap('Geographical focus: ' + geoFocus)}<br/>`;
                        tooltip += wrap('Participation: ' + participationText);
                        return tooltip;
                    } else if (params.dataType === 'edge') {
                        return `Link: ${params.data.source} → ${params.data.target}`;
                    }
                    return '';
                }
            },
            legend: [{
                data: themes.map(t => t.name),
                textStyle: { color: '#e0e0e0', fontFamily: 'CustomFont, sans-serif' }
            }],
            series: [{
                type: 'graph',
                layout: 'force',
                roam: true,
                label: {
                    show: true,
                    position: 'right',
                    fontSize: 10,
                    fontFamily: 'CustomFont, sans-serif',
                    color: '#e0e0e0'
                },
                force: {
                    repulsion: 100,
                    edgeLength: [50, 150]
                },
                data: graphNodes,
                links: allLinks,
                categories: themes,
                lineStyle: {
                    curveness: 0,
                    opacity: 0.85
                }
            }]
        };

        myChart.setOption(option);

        window.addEventListener('resize', () => {
            if (myChart) myChart.resize();
        });
    }

    // ===== Start =====
    init();
</script>

</body>
</html>
